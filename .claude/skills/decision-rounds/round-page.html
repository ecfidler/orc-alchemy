<title>Decision Rounds</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600&display=swap">
<style>
/* Layout: one reading column of question cards, a sticky answer bar at the bottom. Light is the default; dark only by the page's own toggle. */
:root {
  --bg: #f5f7f6; --surface: #ffffff; --ink: #16211d; --muted: #5a6964; --line: #d6dedb;
  --accent: #1c6b58; --accent-ink: #ffffff; --accent-soft: #e3f1ec;
  --rec: #8a5a00; --rec-soft: #fbf0d6; --warn: #a3401f;
  --display: "Space Grotesk", "Segoe UI", system-ui, sans-serif;
  --body: "Inter", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
}
:root[data-proto-theme="dark"] {
  --bg: #111816; --surface: #19221f; --ink: #e8efec; --muted: #9aaba5; --line: #2e3b37;
  --accent: #5fc4a8; --accent-ink: #0c1512; --accent-soft: #1d332c;
  --rec: #e8b84f; --rec-soft: #33290f; --warn: #f08a66;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 15px/1.55 var(--body); }
.wrap { max-width: 760px; margin: 0 auto; padding-block: 24px 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 20px; }
header.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brand { font: 600 13px var(--display); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
button { font: 500 14px var(--body); color: var(--ink); background: var(--surface); border: 1px solid var(--line);
  border-radius: 8px; padding: 8px 14px; cursor: pointer; }
button:hover { border-color: var(--accent); }
button:focus-visible, textarea:focus-visible, .opt:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
button.quiet { border-color: transparent; background: transparent; color: var(--muted); padding: 6px 8px; }
button:disabled { opacity: .5; cursor: default; }
.rounds { display: flex; gap: 8px; flex-wrap: wrap; }
.rounds button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.pill { font-size: 12px; font-weight: 600; border-radius: 99px; padding: 2px 9px; white-space: nowrap; }
.pill.open { background: var(--rec-soft); color: var(--rec); }
.pill.sent { background: var(--accent-soft); color: var(--accent); }
h1 { font: 600 26px/1.2 var(--display); margin: 0; text-wrap: balance; }
.meta { color: var(--muted); font-size: 13px; margin: 6px 0 0; }
.note-example { border-left: 3px solid var(--rec); background: var(--rec-soft); padding: 8px 12px; font-size: 13px; }
details.bg { border: 1px solid var(--line); border-radius: 10px; background: var(--surface); padding: 10px 14px; }
details.bg summary { cursor: pointer; font-weight: 600; }
details.bg p { margin: 8px 0 0; color: var(--muted); max-width: 65ch; }
.bulk { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.bulk span { color: var(--muted); font-size: 13px; }
.q { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.q.done { border-color: var(--accent); }
.q-head { display: flex; gap: 10px; align-items: baseline; justify-content: space-between; }
.q-num { font: 600 13px var(--display); color: var(--muted); letter-spacing: .04em; }
.q h2 { font: 600 18px/1.3 var(--display); margin: 2px 0 0; text-wrap: balance; }
.q p { margin: 0; max-width: 65ch; }
.opts { display: flex; flex-direction: column; gap: 8px; }
.opt { display: grid; grid-template-columns: auto 1fr; gap: 4px 10px; align-items: start; border: 1px solid var(--line);
  border-radius: 10px; padding: 10px 12px; cursor: pointer; }
.opt:hover { border-color: var(--accent); }
.opt.on { border-color: var(--accent); background: var(--accent-soft); }
.opt input { margin: 4px 0 0; accent-color: var(--accent); }
.opt-label { font-weight: 600; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.opt-detail { grid-column: 2; color: var(--muted); font-size: 14px; }
.tag-rec { font-size: 11px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--rec); background: var(--rec-soft); border-radius: 4px; padding: 1px 6px; }
.why { font-size: 14px; color: var(--muted); }
.why b { color: var(--rec); font-weight: 600; }
textarea { width: 100%; min-height: 40px; font: 14px/1.5 var(--body); color: var(--ink); background: var(--bg);
  border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; resize: vertical; }
.outcome { border-top: 1px dashed var(--line); padding-top: 10px; font-size: 14px; }
.outcome b { color: var(--accent); }
.bar { position: sticky; bottom: 0; background: var(--bg); border-top: 1px solid var(--line); margin-top: 4px;
  padding: 12px 0 calc(12px + env(safe-area-inset-bottom, 0px)); display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.bar .status { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; min-width: 0; }
.bar .status strong { color: var(--ink); }
.bar .actions { display: flex; gap: 8px; flex-wrap: wrap; }
.empty { border: 1px dashed var(--line); border-radius: 12px; padding: 28px 18px; color: var(--muted); text-align: left; }
.err { color: var(--warn); }
pre.copy { white-space: pre-wrap; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px; font-size: 13px; margin: 0; }
</style>

<div class="wrap">
  <header class="top">
    <span class="brand">Decision rounds</span>
    <button id="theme" class="quiet" type="button">Dark theme</button>
  </header>
  <nav class="rounds" id="rounds" aria-label="Rounds"></nav>
  <main id="main">
    <div class="empty" id="loading">Loading the rounds. Each round that Claude prepares shows here as a set of questions with a recommended answer.</div>
  </main>
</div>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  function h(tag, props) {
    var el = document.createElement(tag);
    if (props) Object.keys(props).forEach(function (k) {
      if (k === "text") el.textContent = props[k];
      else if (k.slice(0, 2) === "on") el.addEventListener(k.slice(2), props[k]);
      else if (props[k] === true) el.setAttribute(k, "");
      else if (props[k] !== false && props[k] != null) el.setAttribute(k, props[k]);
    });
    for (var i = 2; i < arguments.length; i++) { var c = arguments[i]; if (c) el.append(c); }
    return el;
  }

  $("theme").addEventListener("click", function () {
    var dark = document.documentElement.getAttribute("data-proto-theme") === "dark";
    if (dark) document.documentElement.removeAttribute("data-proto-theme");
    else document.documentElement.setAttribute("data-proto-theme", "dark");
    $("theme").textContent = dark ? "Dark theme" : "Light theme";
  });

  var db = null, rounds = [], currentId = null;
  var state = {};      // roundId -> { answers: {qid: {choice, note, byDefault}}, submitted, submittedAt, loaded }
  var saving = false, dirty = {}, saveNote = "";

  function st(id) { return state[id] || (state[id] = { answers: {}, submitted: false, loaded: false }); }
  function round() { return rounds.filter(function (r) { return r.id === currentId; })[0]; }

  function save(id) {
    dirty[id] = true;
    if (saving || !db) return;
    saving = true;
    (function loop() {
      var ids = Object.keys(dirty);
      if (!ids.length) { saving = false; return; }
      var rid = ids[0]; delete dirty[rid];
      var s = st(rid);
      db.doc("answers/" + rid).set({ answers: s.answers, submitted: !!s.submitted, submittedAt: s.submittedAt || null })
        .then(function () { saveNote = ""; }, function () { saveNote = "Could not save. Your answers are still on this page; use Copy answers."; })
        .then(function () { paintBar(); loop(); });
    })();
  }
  var noteTimer = null;
  function saveSoon(id) { clearTimeout(noteTimer); noteTimer = setTimeout(function () { save(id); }, 800); }

  function counts(r, s) {
    var n = 0;
    r.questions.forEach(function (q) { var a = s.answers[q.id]; if (a && (a.choice || (a.note || "").trim())) n++; });
    return { done: n, total: r.questions.length };
  }

  function summaryText(r, s) {
    return r.title + "\n" + r.questions.map(function (q, i) {
      var a = s.answers[q.id] || {};
      var opt = (q.options || []).filter(function (o) { return o.key === a.choice; })[0];
      var line = "Q" + (i + 1) + " " + q.title + ": " + (opt ? opt.label : a.choice === "other" ? "Something else" : "(no answer)");
      if (a.choice && a.choice === q.recommended) line += a.byDefault ? " (recommendation, by default)" : " (recommendation)";
      if ((a.note || "").trim()) line += "\n   Note: " + a.note.trim();
      return line;
    }).join("\n");
  }

  function paintRounds() {
    var nav = $("rounds"); nav.replaceChildren();
    if (rounds.length < 2) return;
    rounds.forEach(function (r) {
      var sent = st(r.id).submitted;
      nav.append(h("button", { type: "button", "aria-pressed": String(r.id === currentId), onclick: function () { open(r.id); } },
        h("span", { text: r.title + " " }), h("span", { class: "pill " + (sent ? "sent" : "open"), text: sent ? "Sent" : "Open" })));
    });
  }

  function paintBar() {
    var r = round(), bar = $("bar"); if (!r || !bar) return;
    var s = st(r.id), c = counts(r, s), left = c.total - c.done;
    var status = bar.querySelector(".status"), actions = bar.querySelector(".actions");
    status.replaceChildren();
    if (saveNote) status.append(h("span", { class: "err", text: saveNote }));
    else if (s.submitted) status.append(h("strong", { text: "Sent to Claude. " }), "Say “answered” in the thread and Claude reads these.");
    else status.append(h("strong", { text: c.done + " of " + c.total + " answered. " }), left ? left + " left take the recommendation when you send." : "Ready to send.");
    actions.replaceChildren(
      h("button", { type: "button", onclick: function () { copy(r, s); } , text: "Copy answers" }),
      s.submitted
        ? h("button", { type: "button", text: "Change answers", onclick: function () { s.submitted = false; s.submittedAt = null; save(r.id); paint(); } })
        : h("button", { type: "button", class: "primary", text: "Send answers", onclick: function () { send(r, s); } })
    );
  }

  function copy(r, s) {
    var text = summaryText(r, s);
    var done = function () { saveNote = ""; var b = $("bar").querySelector(".actions button"); b.textContent = "Copied"; setTimeout(function () { b.textContent = "Copy answers"; }, 1500); };
    var fallback = function () {
      var box = $("copybox"); box.hidden = false; box.textContent = text;
      var sel = getSelection(), range = document.createRange(); range.selectNodeContents(box); sel.removeAllRanges(); sel.addRange(range);
    };
    try { navigator.clipboard.writeText(text).then(done, fallback); } catch (e) { fallback(); }
  }

  function send(r, s) {
    r.questions.forEach(function (q) {
      var a = s.answers[q.id];
      if (!a || (!a.choice && !(a.note || "").trim())) s.answers[q.id] = { choice: q.recommended, note: "", byDefault: true };
    });
    s.submitted = true; s.submittedAt = new Date().toISOString();
    save(r.id); paint();
  }

  function pick(r, q, key) {
    var s = st(r.id), a = s.answers[q.id] || (s.answers[q.id] = { note: "" });
    a.choice = key; delete a.byDefault;
    save(r.id); paintCard(r, q); paintBar();
  }

  function card(r, q, i) {
    var s = st(r.id), a = s.answers[q.id] || {}, locked = s.submitted;
    var el = h("section", { class: "q" + (a.choice || (a.note || "").trim() ? " done" : ""), id: "card-" + q.id });
    el.append(h("div", null, h("div", { class: "q-num", text: "Question " + (i + 1) + " of " + r.questions.length }), h("h2", { text: q.title })));
    if (q.body) el.append(h("p", { text: q.body }));
    var opts = h("div", { class: "opts", role: "radiogroup", "aria-label": q.title });
    (q.options || []).concat([{ key: "other", label: "Something else", detail: "Say what you want in the note." }]).forEach(function (o) {
      var id = "opt-" + r.id + "-" + q.id + "-" + o.key;
      var input = h("input", { type: "radio", name: "q-" + r.id + "-" + q.id, id: id, disabled: locked, onchange: function () { pick(r, q, o.key); } });
      input.checked = a.choice === o.key;
      var label = h("span", { class: "opt-label" }, h("span", { text: o.label }));
      if (o.key === q.recommended) label.append(h("span", { class: "tag-rec", text: "Recommended" }));
      opts.append(h("label", { class: "opt" + (a.choice === o.key ? " on" : ""), for: id }, input, label, o.detail ? h("span", { class: "opt-detail", text: o.detail }) : null));
    });
    el.append(opts);
    if (q.why) el.append(h("p", { class: "why" }, h("b", { text: "Why: " }), q.why));
    var ta = h("textarea", { id: "note-" + r.id + "-" + q.id, placeholder: "Note for Claude (optional): a condition, an exception, or a question back", "aria-label": "Note for question " + (i + 1), disabled: locked,
      oninput: function () { var x = s.answers[q.id] || (s.answers[q.id] = {}); x.note = ta.value; delete x.byDefault; el.classList.toggle("done", !!(x.choice || ta.value.trim())); saveSoon(r.id); paintBar(); } });
    ta.value = a.note || "";
    el.append(ta);
    if (q.outcome) el.append(h("div", { class: "outcome" }, h("b", { text: "Claude recorded: " }), q.outcome));
    return el;
  }
  function paintCard(r, q) {
    var old = $("card-" + q.id); if (old) old.replaceWith(card(r, q, r.questions.indexOf(q)));
  }

  function paint() {
    paintRounds();
    var main = $("main"), r = round();
    if (!r) { main.replaceChildren(h("div", { class: "empty", text: "No round is open. When Claude has questions for you, the round shows here." })); return; }
    var s = st(r.id), kids = [];
    kids.push(h("div", null, h("h1", { text: r.title }), h("p", { class: "meta", text: [r.ticket, r.date, r.questions.length + " questions"].filter(Boolean).join(" · ") })));
    if (r.example) kids.push(h("div", { class: "note-example", text: r.example }));
    if (r.background && r.background.length) {
      var d = h("details", { class: "bg" }, h("summary", { text: "Background" }));
      r.background.forEach(function (p) { d.append(h("p", { text: p })); });
      kids.push(d);
    }
    if (!s.submitted) kids.push(h("div", { class: "bulk" },
      h("button", { type: "button", text: "Accept all recommendations", onclick: function () {
        r.questions.forEach(function (q) { var a = s.answers[q.id] || (s.answers[q.id] = { note: "" }); if (!a.choice) a.choice = q.recommended; });
        save(r.id); paint(); } }),
      h("span", { text: "Fills each question you have not answered. You can still change one." })));
    r.questions.forEach(function (q, i) { kids.push(card(r, q, i)); });
    kids.push(h("pre", { class: "copy", id: "copybox", hidden: true }));
    kids.push(h("div", { class: "bar", id: "bar" }, h("div", { class: "status" }), h("div", { class: "actions" })));
    var wrap = h("div", { style: "display:flex;flex-direction:column;gap:16px" });
    kids.forEach(function (k) { wrap.append(k); });
    main.replaceChildren(wrap);
    paintBar();
  }

  function open(id) {
    currentId = id;
    var s = st(id);
    if (s.loaded || !db) { paint(); return; }
    db.doc("answers/" + id).get().then(function (snap) {
      var d = snap.exists ? snap.data() : null;
      if (d) { s.answers = JSON.parse(JSON.stringify(d.answers || {})); s.submitted = !!d.submitted; s.submittedAt = d.submittedAt || null; }
      s.loaded = true; paint();
    }, function () { s.loaded = true; paint(); });
  }

  function fail(text) { $("main").replaceChildren(h("div", { class: "empty err", text: text })); }

  var timer = setTimeout(function () { if (!rounds.length) fail("The rounds cannot be reached yet. Leave the page open; it fills in when the connection answers."); }, 10000);
  window.claude.use("db").then(function (ns) {
    db = ns;
    if (!db) { clearTimeout(timer); fail("This view cannot load the rounds. Open the page signed in to claude.ai."); return; }
    db.collection("rounds").onSnapshot(function (snap) {
      clearTimeout(timer);
      rounds = snap.docs.map(function (d) { var x = d.data() || {}; return { id: d.id, title: String(x.title || d.id), ticket: x.ticket, date: x.date, example: x.example, background: x.background || [], questions: x.questions || [], order: x.order || 0 }; })
        .sort(function (a, b) { return b.order - a.order; });
      if (!currentId || !round()) { if (rounds.length) open(rounds[0].id); else paint(); }
      else if (!document.activeElement || document.activeElement.tagName !== "TEXTAREA") paint();
    }, function () { clearTimeout(timer); fail("The rounds could not be loaded. Reload the page to try again."); });
  });
})();
</script>
