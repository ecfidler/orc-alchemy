<title>Alchemy Landing Page</title>
<meta name="claude:viewport-fit-sides" content="cover">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,200..800;1,6..72,200..800&family=Inter:wght@400;500;600&display=swap">
<style>
/* PROTOTYPE (ORC-150), throwaway. Three landing pages with the mug stain, switchable from the bar. Shell C "Binder" and its CSS come from ORC-147.
   Alerts are flat, banner-shaped sticky notes: yellow = act on it, red = something failed, blue = information.
   The logo is a 16 x 16 pixel-art potion (Ethan's art), scaled only by whole powers of two. Palette is ORC-144 "Highlighter". */
:root {
  --paper: #FFFCF5; --paper-raised: #FFFFFF; --ink: #222222; --ink-muted: #595959;
  --rule: #E3DECE; --rule-strong: #8A8578;
  --danger: #C2271D; --success: #1F7A3A; --info: #1E5FB4; --warning: #7F6200;
  --note: #FFE45C; --note-red: #FFB3A8; --note-blue: #A9CCFF; --note-ink: #222222;
  --note-shadow: rgba(60, 45, 0, .20);
  --margin-rule: #C2271D;
  --flag-yellow: #FFE45C; --flag-blue: #7FB6FF; --flag-green: #7EE08F; --flag-orange: #FFAE5C; --flag-ink: #222222;
  --potion-ink: #222222; --potion-cork: #9C6B3C; --potion-glass: #DCEFE2; --potion-glint: #FFFFFF; --potion-liquid: #2E8B4A; --potion-bubble: #8FD9A6;
  --bar: #222222; --bar-fg: #FFFCF5;
  --panel: color-mix(in srgb, var(--ink) 6%, var(--paper));
  --serif: "Newsreader", Georgia, "Times New Roman", serif;
  --sans: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --grain-opacity: .05;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #000000; --paper-raised: #0A0A0A; --ink: #FFFFFF; --ink-muted: #ADADAD; --rule: #222222; --rule-strong: #6B6B6B;
  --danger: #FF5C52; --success: #4ED07A; --info: #5EA2FF; --warning: #FFD93D;
  --note: #FFE45C; --note-red: #FF9C8F; --note-blue: #9CC4FF; --note-ink: #000000; --note-shadow: rgba(255, 255, 255, .10);
  --margin-rule: #FF5C52; --potion-ink: #E8E8E8; --potion-glass: #10301B; --potion-glint: #CFEFD8; --potion-liquid: #4ED07A; --potion-bubble: #B6F0C8;
  --flag-ink: #000000;
  --bar: #FFFFFF; --bar-fg: #000000; --grain-opacity: .07; color-scheme: dark } }
:root[data-theme="dark"] {
  --paper: #000000; --paper-raised: #0A0A0A; --ink: #FFFFFF; --ink-muted: #ADADAD; --rule: #222222; --rule-strong: #6B6B6B;
  --danger: #FF5C52; --success: #4ED07A; --info: #5EA2FF; --warning: #FFD93D;
  --note: #FFE45C; --note-red: #FF9C8F; --note-blue: #9CC4FF; --note-ink: #000000; --note-shadow: rgba(255, 255, 255, .10);
  --margin-rule: #FF5C52; --potion-ink: #E8E8E8; --potion-glass: #10301B; --potion-glint: #CFEFD8; --potion-liquid: #4ED07A; --potion-bubble: #B6F0C8;
  --flag-ink: #000000;
  --bar: #FFFFFF; --bar-fg: #000000; --grain-opacity: .07; color-scheme: dark }

html { background: var(--paper); }
body { background: var(--paper); color: var(--ink); font-family: var(--serif); font-weight: 450; font-size: 17px; line-height: 1.5; font-optical-sizing: auto; min-height: 100%; }
body::after { content: ""; position: fixed; inset: 0; pointer-events: none; opacity: var(--grain-opacity); z-index: 0;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .5  0 0 0 0 .5  0 0 0 0 .5  0 0 0 1 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }
h1, h2, h3 { margin: 0; font-weight: 500; text-wrap: balance; }
p { margin: 0; }
a { color: inherit; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--info); outline-offset: 2px; }
.lbl { font-family: var(--sans); font-size: 10.5px; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-muted); line-height: 1.2; }
.muted { color: var(--ink-muted); }
.num { font-variant-numeric: tabular-nums; }
.proto { font-family: var(--sans); font-size: 12px; color: var(--ink-muted); letter-spacing: .02em; max-width: 72ch; margin-bottom: 14px; }
.proto b { color: var(--ink); font-weight: 600; }

/* ---------- pixel potion (placeholder for Ethan's 16 x 16 art) ---------- */
.potion { flex: none; display: block; image-rendering: pixelated; shape-rendering: crispEdges; }
.mark { display: inline-flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); }
.word { font-family: var(--serif); font-weight: 560; font-size: 20px; letter-spacing: -.01em; line-height: 1; white-space: nowrap; }
.word small { font-family: var(--sans); font-size: 10px; font-weight: 600; letter-spacing: .1em; margin-left: 4px; color: var(--ink-muted); vertical-align: 3px; }

/* ---------- shell C: binder margin ---------- */
/* Nav = page-marker flags stuck to the margin rule: a see-through body, an opaque stuck end at the rule. The current page sticks out further. */
.nav { display: grid; gap: 9px; font-family: var(--sans); font-size: 13.5px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; margin-right: -17.5px; justify-items: end; position: relative; z-index: 2; }
.nav a { --c: var(--flag-yellow); display: block; width: calc(100% - 14px); box-sizing: border-box; text-decoration: none; color: var(--flag-ink); padding: 11px 14px 11px 16px;
  background: linear-gradient(90deg, color-mix(in srgb, var(--c) 55%, #FFFFFF) 0 68%, var(--c) 68% 100%);
  transition: width .15s ease; }
.nav a:hover { width: calc(100% - 6px); }
.nav a[aria-current="page"] { width: calc(100% + 4px); background: var(--c); box-shadow: 0 3px 6px -4px var(--note-shadow); }
.nav.arrow a { clip-path: polygon(14px 0, 100% 0, 100% 100%, 14px 100%, 0 50%); padding-left: 24px; }
.nav.multi a:nth-child(2) { --c: var(--flag-blue); }
.nav.multi a:nth-child(3) { --c: var(--flag-green); }
.nav.multi a:nth-child(4) { --c: var(--flag-orange); }
.nav a:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { .nav a { transition: none; } }
.grid { position: relative; z-index: 1; display: grid; grid-template-columns: 200px minmax(0, 1fr); min-height: 100vh; }
.rail { border-right: 1.5px solid var(--margin-rule); position: relative; padding: 20px 16px 20px max(16px, env(safe-area-inset-left, 0px)); display: grid; align-content: start; gap: 22px; }
.rail::after { content: ""; position: absolute; top: 0; bottom: 0; right: 4px; border-right: 1px solid color-mix(in srgb, var(--margin-rule) 45%, transparent); }
.main { min-width: 0; padding: 20px max(16px, env(safe-area-inset-right, 0px)) 160px 28px; }
.inner { max-width: 760px; }
@media (max-width: 680px) {
  .grid { grid-template-columns: minmax(0, 1fr); min-height: 0; }
  .rail { border-right: 0; border-bottom: 1.5px solid var(--margin-rule); padding: 14px max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px)); gap: 8px; }
  .rail::after { top: auto; bottom: 3px; left: 0; right: 0; border-right: 0; border-bottom: 1px solid color-mix(in srgb, var(--margin-rule) 45%, transparent); }
  .nav { grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); align-items: end; margin-right: 0; margin-bottom: -11.5px; gap: 6px; font-size: 11px; letter-spacing: .04em; }
  .nav a { width: auto; height: 54px; padding: 10px 4px 0; text-align: center; overflow-wrap: anywhere;
    background: linear-gradient(180deg, color-mix(in srgb, var(--c) 55%, #FFFFFF) 0 62%, var(--c) 62% 100%); }
  .nav a:hover { width: auto; }
  .nav a[aria-current="page"] { width: auto; height: 64px; }
  .nav.arrow a { clip-path: polygon(50% 0, 100% 10px, 100% 100%, 0 100%, 0 10px); padding-left: 4px; padding-top: 14px; }
  .main { padding: 16px max(16px, env(safe-area-inset-right, 0px)) 300px max(16px, env(safe-area-inset-left, 0px)); }
}

/* ---------- alerts: flat banner-shaped sticky notes ---------- */
.alerts { display: grid; gap: 10px; margin-bottom: 16px; }
.alerts:empty { display: none; }
.note { --c: var(--note); position: relative; display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px; background: var(--c); color: var(--note-ink);
  padding: 11px 40px 12px 14px; font-family: var(--sans); font-size: 13.5px; line-height: 1.4; font-weight: 500;
  box-shadow: 0 4px 8px -5px var(--note-shadow); clip-path: polygon(0 0, 100% 0, 100% calc(100% - 12px), calc(100% - 12px) 100%, 0 100%); }
.note::after { content: ""; position: absolute; right: 0; bottom: 0; width: 12px; height: 12px; background: linear-gradient(135deg, color-mix(in srgb, var(--c) 72%, #000) 50%, transparent 50%); }
.note.red { --c: var(--note-red); }
.note.blue { --c: var(--note-blue); }
.note .k { font-size: 10px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; flex: none; }
.note .msg { flex: 1 1 22ch; min-width: 0; }
.note b { font-weight: 700; }
.note .act { all: unset; cursor: pointer; text-decoration: underline; text-underline-offset: 2px; font-weight: 700; }
.note .x { all: unset; cursor: pointer; position: absolute; right: 10px; top: 8px; font-size: 18px; line-height: 1; padding: 2px 4px; }
.note .act:focus-visible, .note .x:focus-visible { outline: 2px solid var(--note-ink); outline-offset: 1px; }

/* ---------- page body: the character list ---------- */
.page-top { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 10px; }
.page h1 { font-size: 30px; }
.btn { font-family: var(--sans); font-size: 13px; font-weight: 600; border: 1.5px solid var(--ink); background: var(--ink); color: var(--paper); border-radius: 6px; padding: 7px 14px; cursor: pointer; }
.list { list-style: none; margin: 16px 0 0; padding: 0; border-top: 1.5px solid var(--rule-strong); }
.list li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 16px; align-items: baseline; padding: 10px 2px; border-bottom: 1px solid var(--rule); }
.list .name { font-size: 19px; font-weight: 500; }
.list .who { grid-column: 1; font-size: 14.5px; color: var(--ink-muted); }
.list .lv { grid-column: 2; grid-row: 1 / span 2; align-self: center; text-align: right; }
.list .lv b { display: block; font-size: 24px; font-weight: 500; line-height: 1; }

/* ---------- logo slots ---------- */
.slots { margin-top: 40px; border: 1.5px solid var(--rule-strong); border-radius: 6px; background: var(--paper-raised); padding: 14px 16px 16px; display: grid; gap: 14px; }
.slots h2 { font-size: 19px; }
.ladder { display: flex; flex-wrap: wrap; gap: 18px 22px; align-items: flex-end; }
.slot { display: grid; justify-items: center; gap: 6px; text-align: center; }
.slot .box { display: grid; place-items: center; border: 1px dashed var(--rule-strong); padding: 6px; max-width: 100%; }
.tab-mock { display: inline-flex; align-items: center; gap: 6px; background: var(--panel); border-radius: 8px 8px 0 0; padding: 6px 12px; font-family: var(--sans); font-size: 12px; }
.slot-table { width: 100%; border-collapse: collapse; font-family: var(--sans); font-size: 12.5px; }
.slot-table th, .slot-table td { text-align: left; padding: 5px 10px 5px 0; border-bottom: 1px solid var(--rule); vertical-align: top; }
.slot-table th { font-weight: 600; color: var(--ink-muted); text-transform: uppercase; letter-spacing: .06em; font-size: 10.5px; }
.slot-table td.num { white-space: nowrap; }
.table-scroll { overflow-x: auto; }

/* ---------- floating bar ---------- */
.bar { position: fixed; z-index: 20; left: 50%; transform: translateX(-50%); bottom: calc(12px + env(safe-area-inset-bottom, 0px)); width: min(940px, calc(100% - 24px));
  background: var(--bar); color: var(--bar-fg); border-radius: 12px; padding: 10px 12px; display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center;
  font-family: var(--sans); font-size: 12px; box-shadow: 0 8px 24px rgba(0,0,0,.25); }
.bar fieldset { border: 0; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
.bar legend { float: left; margin-right: 6px; opacity: .7; text-transform: uppercase; letter-spacing: .08em; font-size: 10px; }
.bar label { cursor: pointer; }
.bar input { position: absolute; opacity: 0; pointer-events: none; }
.bar label span { display: inline-block; padding: 3px 8px; border-radius: 6px; border: 1px solid color-mix(in srgb, var(--bar-fg) 30%, transparent); }
.bar input:checked + span { background: var(--bar-fg); color: var(--bar); }
.bar input:focus-visible + span { outline: 2px solid var(--note); outline-offset: 1px; }
@media (max-width: 560px) { .bar { font-size: 11px; gap: 6px 10px; } }
/* ---------- ORC-150: mug stain ---------- */
/* A coffee ring left by a mug set down on the sheet. Brown ring, darker at the dried edge, a faint wash inside, a second partial ring where the mug moved. */
:root { --stain: #8C5A2B; --stain-wash: #A87442; --stain-op: .55; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --stain: #C8915A; --stain-wash: #C8915A; --stain-op: .62; } }
:root[data-theme="dark"] { --stain: #C8915A; --stain-wash: #C8915A; --stain-op: .62; }
.stain { position: absolute; pointer-events: none; z-index: 0; opacity: var(--stain-op); }
.stain svg { display: block; width: 100%; height: 100%; overflow: visible; }

.btn.ghost { background: transparent; color: var(--ink); }
.btn.lg { font-size: 14px; padding: 10px 18px; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; }
.facts { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; font-size: 15px; }
.facts li { display: grid; grid-template-columns: 16px minmax(0, 1fr); gap: 8px; align-items: baseline; }
.facts li::before { content: ""; width: 9px; height: 9px; border: 1.5px solid var(--ink); transform: translateY(1px); }
.tagline { font-size: 19px; max-width: 34ch; }
.hero-word { font-family: var(--serif); font-weight: 560; letter-spacing: -.02em; line-height: .95; }
.hero-word small { font-family: var(--sans); font-weight: 600; letter-spacing: .1em; color: var(--ink-muted); }
.pos { position: relative; }
.pos > :not(.stain) { position: relative; z-index: 1; }

/* A: cover sheet, no binder shell */
.cover-wrap { position: relative; z-index: 1; min-height: 100vh; display: grid; place-items: center; padding: 40px max(16px, env(safe-area-inset-right, 0px)) 180px max(16px, env(safe-area-inset-left, 0px)); }
.cover { width: min(720px, 100%); background: var(--paper-raised); border: 1.5px solid var(--rule-strong); padding: 44px 44px 40px; display: grid; gap: 22px; justify-items: start; box-shadow: 0 10px 30px -18px var(--note-shadow); }
.cover .top { display: flex; flex-wrap: wrap; gap: 22px 28px; align-items: center; }
.cover .hero-word { font-size: clamp(44px, 9vw, 72px); }
.cover .hero-word small { font-size: 14px; margin-left: 6px; vertical-align: 26px; }
.cover .foot { width: 100%; border-top: 1px solid var(--rule); padding-top: 14px; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; font-family: var(--sans); font-size: 12.5px; color: var(--ink-muted); }
.cover .foot a { font-weight: 600; color: var(--ink); }
@media (max-width: 560px) { .cover { padding: 28px 20px 24px; } }

/* B: welcome block on the Characters page */
.welcome { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 18px 26px; align-items: center; padding: 26px 0 30px; }
.welcome .hero-word { font-size: 44px; }
.welcome .hero-word small { font-size: 11px; margin-left: 4px; vertical-align: 16px; }
.welcome .txt { display: grid; gap: 14px; min-width: 0; }
@media (max-width: 560px) { .welcome { grid-template-columns: minmax(0, 1fr); } }
.empty { margin-top: 16px; border: 1.5px dashed var(--rule-strong); padding: 18px; font-size: 15px; color: var(--ink-muted); }

/* C: its own Home page in the shell */
/* Round 2 (Ethan, 2026-10-19): one column, potion inline with a larger title. */
.home { display: grid; gap: 22px; justify-items: start; padding-top: 18px; max-width: 640px; }
.home .title-row { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 24px; }
.home .hero-word { font-size: clamp(52px, 10vw, 84px); }
.home .hero-word small { font-size: 15px; margin-left: 6px; vertical-align: 32px; }
.home .side { display: grid; gap: 10px; min-width: 0; width: 100%; margin-top: 8px; }
.home .side h2 { font-size: 20px; }
.home .list { margin-top: 0; }
.home .more { font-family: var(--sans); font-size: 13px; font-weight: 600; }

.qa { margin-top: 40px; border-top: 1.5px solid var(--rule-strong); padding-top: 14px; display: grid; gap: 8px; font-size: 15px; max-width: 70ch; }
.qa h2 { font-size: 19px; }
.qa ul { margin: 0; padding-left: 20px; display: grid; gap: 4px; }
.cover-proto { margin: 0; width: min(720px, 100%); }
.cover-wrap { place-items: start center; align-content: center; gap: 12px; }
</style>

<div id="app"></div>

<form class="bar" id="bar" aria-label="Prototype controls" onsubmit="return false">
  <fieldset><legend>Landing</legend>
    <label><input type="radio" name="v" id="v-a" value="a"><span>A Cover sheet</span></label>
    <label><input type="radio" name="v" id="v-b" value="b"><span>B Top of Characters</span></label>
    <label><input type="radio" name="v" id="v-c" value="c" checked><span>C Own Home page</span></label>
  </fieldset>
  <fieldset><legend>Visitor</legend>
    <label><input type="radio" name="st" id="st-new" value="new" checked><span>First visit</span></label>
    <label><input type="radio" name="st" id="st-has" value="has"><span>Has characters</span></label>
  </fieldset>
  <fieldset><legend>Potion</legend>
    <label><input type="radio" name="px" id="px-64" value="64" checked><span>64</span></label>
    <label><input type="radio" name="px" id="px-128" value="128"><span>128</span></label>
    <label><input type="radio" name="px" id="px-256" value="256"><span>256</span></label>
  </fieldset>
  <fieldset><legend>Theme</legend>
    <label><input type="radio" name="th" id="th-sys" value="system" checked><span>System</span></label>
    <label><input type="radio" name="th" id="th-l" value="light"><span>Light</span></label>
    <label><input type="radio" name="th" id="th-d" value="dark"><span>Dark</span></label>
  </fieldset>
</form>

<script>
const S = { v: "c", st: "new", px: "64" };
/* Ethan's 16 x 16 potion (assets/pixil-frame-0.png), scaled by whole powers of two only. */
const POTION = "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABAAAAAQCAYAAAAf8/9hAAABdElEQVQ4T5WRP0sDMRiHf0nvrC2IFbr5DRy03RUqFr+Eo4KLk0oXBSs6OjjU0VE/gotWKeoktEjBwU+hRa9Xe0nkzZmQa61/nuGS901+T3J3DP9AKaVOVxawdn7HTM9OfoPCNJKAMJI/CczJq2e3unYlQwJzkktxfxEbz5GeD0oSAgoXDkq2NjAZbxuUEFZAYTpJZjgeK3XMHZXjPlNgHwqIAC5VQsIIN0y09m70WDiJBZZAQoWxhPaYLPsuXDxe0iOh/PiS4i2E52XQ2rq0YcIK7MmHJUByWoBKM/i5MfRFBPHShTeeHS0gVD4Vd53rZqcn0Om8or3ZwEx1Hk/VuxECD1C5FBgYfROgpzCZn0IQBnhYv9CbfxTE101DCKEXpJIQQR/tSkPXs7VleEGEZuU6KaCHKxE8Ave4XpTdPto79yjUyuAh0Ny+SoQJWxhJL3xHKuvrV9FwDk/5aO7Wh8JEouF+UBf3vw8y1CSJLb4YFaa1T3XZ1j50CdQPAAAAEGRlQkc4NjY1MDE3NDgxNzY2QjYxySIyZAAAAABJRU5ErkJggg==";
const potion = (px) => `<img class="potion" src="${POTION}" width="${px}" height="${px}" alt="">`;

let sid = 0;
/* The mug stain: an SVG ring roughened by a turbulence filter. Placeholder until Ethan draws the real one. */
function stain(style) {
  const id = "st" + (++sid);
  return `<span class="stain" aria-hidden="true" style="${style}"><svg viewBox="0 0 220 220">
  <defs><filter id="${id}" x="-20%" y="-20%" width="140%" height="140%">
    <feTurbulence type="fractalNoise" baseFrequency=".035" numOctaves="2" seed="${7 + sid}" result="t"/>
    <feDisplacementMap in="SourceGraphic" in2="t" scale="9" xChannelSelector="R" yChannelSelector="G"/>
  </filter></defs>
  <g filter="url(#${id})">
    <circle cx="110" cy="110" r="86" fill="var(--stain-wash)" fill-opacity=".09"/>
    <circle cx="110" cy="110" r="86" fill="none" stroke="var(--stain)" stroke-width="5" stroke-dasharray="470 40" stroke-linecap="round" transform="rotate(-30 110 110)"/>
    <circle cx="110" cy="110" r="82" fill="none" stroke="var(--stain)" stroke-opacity=".35" stroke-width="2"/>
    <circle cx="124" cy="100" r="84" fill="none" stroke="var(--stain)" stroke-opacity=".3" stroke-width="3" stroke-dasharray="150 400" transform="rotate(200 124 100)"/>
    <circle cx="200" cy="168" r="4" fill="var(--stain)" fill-opacity=".6"/>
    <circle cx="210" cy="152" r="2" fill="var(--stain)" fill-opacity=".5"/>
  </g></svg></span>`;
}

const word = (cls = "") => `<h1 class="hero-word ${cls}">Alchemy<small>5E</small></h1>`;
const tagline = `<p class="tagline">Build and keep your D&amp;D 5e characters. Everything stays in this browser.</p>`;
const facts = `<ul class="facts">
  <li>Build a character step by step, or roll a random one.</li>
  <li>Bring in characters and homebrew from Dungeon Master's Vault (.orcbrew).</li>
  <li>Works without an account. Export your characters any time.</li>
</ul>`;
const startActions = `<div class="actions"><button type="button" class="btn lg">New character</button><button type="button" class="btn ghost lg">Random character</button><button type="button" class="btn ghost lg">Import from Dungeon Master's Vault</button></div>`;

const CHARS = [
  ["Brannoc Ashvale", "Hill Dwarf · Cleric (Life)", 7],
  ["Ysolde Marrow", "Tiefling · Warlock (Hexblade)", 5],
  ["Pip Tallowmere", "Lightfoot Halfling · Rogue (Thief) / Fighter", 9],
  ["Sister Okonma", "Human · Paladin (Devotion)", 12],
];
const list = (n) => `<ul class="list">${CHARS.slice(0, n).map(([nm, w, l]) => `<li><span class="name">${nm}</span><span class="who">${w}</span><span class="lv"><b class="num">${l}</b><span class="lbl">Level</span></span></li>`).join("")}</ul>`;

function shell(current, inner, proto) {
  const tabs = ["Characters", "Import", "My Content", "Preferences"].map((t) => `<a href="#top"${t === current ? ' aria-current="page"' : ""}>${t}</a>`).join("");
  const mark = `<a class="mark" href="#top" aria-label="Alchemy 5e, home">${potion(32)}<span class="word">Alchemy<small>5E</small></span></a>`;
  return `<div class="grid" id="top">
  <aside class="rail">${mark}<nav class="nav multi flag" aria-label="Main">${tabs}</nav></aside>
  <main class="main"><div class="inner"><p class="proto">${proto}</p>${inner}${qa()}</div></main></div>`;
}

function qa() {
  const Q = {
    a: [`<b>Where:</b> <code>/</code> shows the cover only while no characters are stored. Once you have one, <code>/</code> opens the character list as today. The cover sits outside the binder shell, like the front of a folder.`,
        `<b>Coming back:</b> the cover is gone for returning users. "About Alchemy 5e" in the cover footer is the only way back, so the shell would need a link to it (Preferences, or the rail logo).`],
    b: [`<b>Where:</b> no new route. The welcome block is the top of the Characters page at <code>/</code>, inside the shell.`,
        `<b>Coming back:</b> with characters stored, the block shrinks away and only the stain stays, faint, in the page corner. The list is the first thing a returning user sees.`],
    c: [`<b>Where:</b> <code>/</code> is always Home. The character list moves to <code>/characters</code> (the Characters tab). The rail logo goes Home; there is no Home tab.`,
        `<b>Coming back:</b> Home shows your three most recent characters, so it is one extra click to the full list. Saved links to <code>/</code> still work.`],
  }[S.v];
  return `<section class="qa"><h2>What this variant decides</h2><ul>${Q.map((q) => `<li>${q}</li>`).join("")}</ul></section>`;
}

function variantA() {
  if (S.st === "has") return shell("Characters", `<div class="page pos">${stain("width:150px;height:150px;right:-30px;top:-40px;opacity:calc(var(--stain-op) * .45)")}<div class="page-top"><h1>Characters</h1><button type="button" class="btn">New character</button></div>${list(4)}<p class="muted" style="font-size:13px;margin-top:8px">Example characters.</p></div>`,
    `<b>Variant A, returning user.</b> With characters stored, <code>/</code> skips the cover and opens the list, as today. A faint stain is kept in the page corner.`);
  const px = +S.px;
  return `<div class="cover-wrap"><p class="proto cover-proto"><b>Variant A, first visit.</b> A cover sheet with no binder shell. Potion at ${px} (${px / 16}&times;).</p>
  <div class="cover pos">
    ${stain(`width:${px === 256 ? 300 : 260}px;height:${px === 256 ? 300 : 260}px;right:-70px;top:-80px`)}
    <div class="top">${potion(px)}<div style="display:grid;gap:10px">${word()}${tagline}</div></div>
    ${facts}
    ${startActions}
    <div class="foot"><span>Uses the SRD 5.1 rules. Your data never leaves this browser.</span><a href="#top">About Alchemy 5e</a></div>
  </div></div>
  <div style="padding:0 max(16px, env(safe-area-inset-right, 0px)) 160px max(16px, env(safe-area-inset-left, 0px));max-width:760px;margin:0 auto">${qa()}</div>`;
}

function variantB() {
  const px = +S.px;
  if (S.st === "has") return shell("Characters", `<div class="page pos">${stain("width:180px;height:180px;right:-40px;top:-60px;opacity:calc(var(--stain-op) * .6)")}<div class="page-top"><h1>Characters</h1><button type="button" class="btn">New character</button></div>${list(4)}<p class="muted" style="font-size:13px;margin-top:8px">Example characters.</p></div>`,
    `<b>Variant B, returning user.</b> The welcome block is gone; the stain stays in the corner of the Characters page.`);
  return shell("Characters", `<div class="page pos">
    ${stain(`width:${px === 256 ? 280 : 230}px;height:${px === 256 ? 280 : 230}px;right:-50px;top:-30px`)}
    <section class="welcome">${potion(px)}<div class="txt">${word()}${tagline}${startActions}</div></section>
    <div class="page-top"><h2 style="font-size:24px">Your characters</h2></div>
    <p class="empty">No characters yet. Make a new one above, or import them from Dungeon Master's Vault.</p>
    <div style="margin-top:22px">${facts}</div>
  </div>`, `<b>Variant B, first visit.</b> The welcome sits at the top of the Characters page, inside the binder shell. Potion at ${px} (${px / 16}&times;).`);
}

function variantC() {
  const px = +S.px;
  const side = S.st === "has"
    ? `<div class="side"><h2>Recent characters</h2>${list(3)}<a class="more" href="#top">All characters (4)</a></div>`
    : `<div class="side"><h2>Recent characters</h2><p class="empty" style="margin-top:0">Characters you make or import show here.</p></div>`;
  return shell("", `<div class="page pos">
    ${stain("width:240px;height:240px;left:470px;top:250px")}
    <section class="home"><div class="title-row">${potion(px)}${word()}</div>${tagline}${startActions}${facts}${side}</section>
  </div>`, `<b>Variant C round 3, ${S.st === "has" ? "returning user" : "first visit"}.</b> One column; the potion sits inline with a larger title; the facts come before Recent characters; the stain sits lower, beside the buttons and facts. No tab is current; the rail logo leads here. Potion at ${px} (${px / 16}&times;).`);
}

function render() {
  sid = 0;
  document.getElementById("app").innerHTML = { a: variantA, b: variantB, c: variantC }[S.v]();
}
document.getElementById("bar").addEventListener("change", (e) => {
  const t = e.target;
  if (t.name === "th") { if (t.value === "system") document.documentElement.removeAttribute("data-theme"); else document.documentElement.setAttribute("data-theme", t.value); return; }
  S[t.name] = t.value; render();
});
render();
</script>
