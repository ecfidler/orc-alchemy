<style>
/* PROTOTYPE (ORC-336), throwaway. The new Class step of the builder, from the answers of ORC-335.
   Paper theme (docs/design/theme.md). Light is the default; dark is only the Theme toggle here.
   Hash: #<variant> a, b, c or d. */
:root {
  --paper: #fffcf5; --paper-raised: #ffffff; --ink: #222222; --ink-muted: #595959;
  --rule: #e3dece; --rule-strong: #8a8578; --danger: #c2271d; --success: #1f7a3a; --info: #1e5fb4;
  --note: #ffe45c; --note-ink: #222222;
  --panel: color-mix(in srgb, var(--ink) 6%, var(--paper));
  --wash: color-mix(in srgb, var(--ink) 40%, transparent);
  --shadow: rgba(60, 45, 0, 0.22);
  --proto-bg: #1c2b4a; --proto-fg: #ffffff;
  --font-serif: "Newsreader", Georgia, "Times New Roman", serif;
  --font-sans: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
}
:root[data-proto-theme="dark"] {
  color-scheme: dark; --paper: #000000; --paper-raised: #0a0a0a; --ink: #ffffff; --ink-muted: #adadad;
  --rule: #222222; --rule-strong: #6b6b6b; --danger: #ff5c52; --success: #4ed07a; --info: #5ea2ff;
  --note-ink: #000000; --wash: rgba(255, 255, 255, 0.22); --shadow: rgba(255, 255, 255, 0.12);
  --proto-bg: #dfe8ff; --proto-fg: #0b1430;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--font-serif); font-size: 17px; line-height: 1.5;
  font-weight: 450; font-variant-numeric: lining-nums tabular-nums; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
h1, h2, h3, h4, p, ul, ol, dl, dd { margin: 0; }
ul, ol { padding: 0; list-style: none; }
:focus-visible { outline: 2px solid var(--info); outline-offset: 2px; }
svg.px { display: inline-block; vertical-align: -3px; flex: none; }

/* ---------- prototype chrome (not part of the design) ---------- */
.gut { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.proto-top { font-family: var(--font-sans); font-size: 12.5px; background: var(--proto-bg); color: var(--proto-fg);
  padding-block: 8px; display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; }
.proto-group { display: inline-flex; gap: 4px; align-items: center; flex-wrap: wrap; }
.proto-group > span { opacity: .75; margin-right: 2px; }
.proto-top button { background: transparent; border: 1px solid currentColor; border-radius: 999px; padding: 1px 10px; font-size: 12px; }
.proto-top button[aria-pressed="true"] { background: var(--proto-fg); color: var(--proto-bg); }
.proto-notes { font-family: var(--font-sans); font-size: 13px; line-height: 1.45; background: var(--panel); border-bottom: 1px solid var(--rule); padding-block: 8px; }
.proto-notes b { font-weight: 600; }
.proto-notes p { max-width: 110ch; }

/* ---------- the builder frame (decided in the stepper prototype) ---------- */
.stagewrap { padding-block: 18px 80px; }
.stage { position: relative; width: 100%; max-width: 1120px; margin: 0 auto; }
.stage.phone { max-width: 390px; outline: 1px dashed var(--rule-strong); outline-offset: 8px; }
.sans { font-family: var(--font-sans); }
.btn { font-family: var(--font-sans); font-size: 13.5px; font-weight: 500; border: 1px solid var(--ink); background: var(--paper-raised); padding: 7px 14px; border-radius: 0; white-space: nowrap; min-height: 36px; display: inline-flex; align-items: center; justify-content: center; gap: 7px; }
.btn:hover { background: var(--panel); }
.btn.solid { background: var(--ink); color: var(--paper); }
.btn.solid:hover { background: color-mix(in srgb, var(--ink) 85%, var(--paper)); }
.btn.ghost { border-color: transparent; background: none; text-decoration: underline; text-underline-offset: 3px; padding-inline: 6px; }
.btn.small { min-height: 30px; padding: 3px 10px; font-size: 13px; }
.btn.sq { width: 34px; min-height: 34px; padding: 0; }
.btn:disabled { opacity: .35; cursor: default; }
.count { display: inline-block; font-family: var(--font-sans); font-size: 11.5px; font-weight: 600; line-height: 18px; min-width: 18px; padding: 0 5px; text-align: center;
  background: var(--note); color: var(--note-ink); border-radius: 9px; }
.rail { display: flex; border-bottom: 1px solid var(--rule-strong); margin-bottom: 18px; overflow-x: auto; scrollbar-width: thin; }
.rail li { flex: 1 0 auto; }
.rail span.s { display: flex; border-bottom: 3px solid transparent; padding: 8px 9px 7px; font-family: var(--font-sans); font-size: 13.5px; font-weight: 500;
  color: var(--ink-muted); align-items: center; justify-content: center; gap: 6px; white-space: nowrap; }
.rail span.s.cur { color: var(--ink); border-bottom-color: var(--ink); font-weight: 600; }
.rail span.s.dim { opacity: .5; }
.rail .n { font-size: 11px; opacity: .7; }
.two { display: grid; grid-template-columns: minmax(0, 1fr) 250px; gap: 28px; align-items: start; }
.phone .two { grid-template-columns: 1fr; }
.phone .sum { display: none; }
.sum { position: sticky; top: 8px; }
.h2row { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; border-bottom: 1px solid var(--rule-strong); padding-bottom: 6px; margin-bottom: 14px; }
.h2row h2 { font-size: 26px; font-weight: 600; line-height: 1.2; }
.h2row .of { font-family: var(--font-sans); font-size: 12.5px; color: var(--ink-muted); white-space: nowrap; }
.lab { font-family: var(--font-sans); font-size: 10.5px; font-weight: 500; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-muted); margin-bottom: 6px; }
.sheet { border: 1.5px solid var(--rule-strong); border-radius: 6px; background: var(--paper-raised); padding: 12px 14px; font-size: 15px; }
.sheet .nm { font-size: 22px; font-weight: 500; line-height: 1.2; border-bottom: 1.5px solid var(--rule-strong); min-height: 31px; }
.sheet li { display: flex; justify-content: space-between; gap: 10px; border-bottom: 1px solid var(--rule); padding: 3px 0; min-height: 29px; }
.sheet li span:first-child { font-family: var(--font-sans); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-muted); align-self: center; }
.sheet li span:last-child { text-align: right; min-width: 0; }
.navrow { display: flex; justify-content: space-between; gap: 8px; border-top: 1px solid var(--rule); padding-top: 12px; margin-top: 22px; }

/* ---------- the class cards ---------- */
.selhead { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 8px; }
.selhead h3 { font-family: var(--font-sans); font-size: 15px; font-weight: 700; }
.selhead .st { font-family: var(--font-sans); font-size: 12.5px; font-weight: 600; white-space: nowrap; }
.tiles { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px; }
.tiles.c4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.tiles.c3, .phone .tiles { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.tile { border: 1px solid var(--rule-strong); background: var(--paper-raised); height: 92px; padding: 8px 4px 6px; display: grid; grid-template-rows: 36px auto 14px; justify-items: center; align-items: center; gap: 2px;
  font-family: var(--font-sans); font-size: 13.5px; font-weight: 600; }
.tile:hover:not(:disabled) { background: var(--panel); }
.tile[aria-pressed="true"] { outline: 2px solid var(--ink); outline-offset: -2px; background: var(--panel); }
.tile small { font-size: 10.5px; font-weight: 500; color: var(--ink-muted); line-height: 1.15; text-align: center; }
.dlg .tile { height: 106px; grid-template-rows: 36px auto 26px; }
.tile:disabled { cursor: default; }
.tile:disabled > svg, .tile:disabled > span { opacity: .4; }
.pickA { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.05fr); gap: 18px; align-items: start; }

/* the detail of a class or a subclass */
.detail { border: 1px solid var(--rule-strong); background: var(--paper-raised); padding: 14px 16px; }
.detail.fixed { height: 392px; padding: 0; }
.detail.fixed > .detail-in { height: 100%; display: flex; flex-direction: column; }
.detail.fixed .scroll { flex: 1; min-height: 0; overflow: auto; padding: 14px 16px 8px; }
.detail.fixed .act { margin: 0; padding: 10px 16px; border-top: 1px solid var(--rule-strong); }
.detail.fixed > .empty { padding: 14px 16px; }
.detail .empty { color: var(--ink-muted); font-family: var(--font-sans); font-size: 13.5px; }
.detail h3 { font-size: 24px; font-weight: 600; line-height: 1.2; display: flex; align-items: center; gap: 10px; }
.detail .d { margin: 6px 0 10px; font-size: 16px; }
.detail dl { display: grid; grid-template-columns: 104px 1fr; gap: 2px 10px; font-size: 15px; margin-bottom: 10px; }
.detail dt { font-family: var(--font-sans); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-muted); padding-top: 4px; }
.detail h4 { font-family: var(--font-sans); font-size: 12.5px; font-weight: 700; margin: 8px 0 2px; }
.detail .fl li { display: grid; grid-template-columns: 56px 1fr; font-size: 15px; border-top: 1px solid var(--rule); padding: 2px 0; }
.detail .fl { margin-top: 10px; }
.detail .fl li.hd { border-top: 0; font-family: var(--font-sans); font-size: 12.5px; font-weight: 700; padding-bottom: 3px; }
.detail .fl li.hd span:first-child { color: var(--ink); font-size: 12.5px; padding-top: 0; }
.detail .fl li span:first-child { font-family: var(--font-sans); font-size: 12px; color: var(--ink-muted); padding-top: 3px; }
.detail .act { margin-top: 12px; display: flex; gap: 8px; justify-content: flex-end; }

/* ---------- a class block ---------- */
.cls { border: 1px solid var(--rule-strong); background: var(--paper-raised); margin-bottom: 14px; }
.clshead { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-bottom: 1px solid var(--rule-strong); flex-wrap: wrap; }
.clshead .nm { font-size: 24px; font-weight: 600; line-height: 1.1; display: flex; align-items: center; gap: 10px; margin-right: auto; min-width: 0; }
.clshead .nm .count { margin-left: 2px; }
.lv { display: inline-flex; align-items: center; gap: 0; font-family: var(--font-sans); font-size: 13px; }
.lv > span { margin-right: 8px; font-weight: 600; }
.lv input { width: 46px; height: 34px; text-align: center; border: 1px solid var(--ink); border-left: 0; border-right: 0; background: var(--paper-raised); font-family: var(--font-serif); font-size: 19px; font-weight: 500; border-radius: 0; -moz-appearance: textfield; }
.lv input::-webkit-outer-spin-button, .lv input::-webkit-inner-spin-button { -webkit-appearance: none; }
.clsbody { padding: 4px 12px 12px; }
.cls.closed .clsbody { display: none; }
.cls.closed .clshead { border-bottom: 0; }
.sec { margin-top: 12px; }
.sec > h4 { font-family: var(--font-sans); font-size: 10.5px; font-weight: 500; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-muted); margin-bottom: 4px; }
.lvl { display: grid; grid-template-columns: 62px minmax(0, 1fr); border-top: 1px solid var(--rule-strong); }
.lvl:last-child { border-bottom: 1px solid var(--rule-strong); }
.lvl > .ll { font-family: var(--font-sans); font-size: 12.5px; font-weight: 600; padding-top: 11px; }
.row + .row { border-top: 1px solid var(--rule); }
.rowhead { width: 100%; background: none; border: 0; text-align: left; display: grid; grid-template-columns: minmax(0, auto) minmax(0, 1fr) 16px; gap: 10px; align-items: center; min-height: 42px; padding: 6px 4px 6px 0; }
.rowhead:hover { background: var(--panel); }
.rowhead .cn { font-family: var(--font-sans); font-size: 14px; font-weight: 600; }
.rowhead .pv { text-align: right; font-size: 16px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rowhead .pv.left { font-family: var(--font-sans); font-size: 12.5px; font-weight: 600; }
.rowhead .chev { font-family: var(--font-sans); font-size: 11px; color: var(--ink-muted); }
.rowbody { padding: 2px 0 12px; }
.phone .rowhead { grid-template-columns: minmax(0, 1fr) 16px; gap: 0 10px; min-height: 54px; }
.phone .rowhead .pv { grid-row: 2; grid-column: 1; text-align: left; }
.phone .rowhead .chev { grid-row: 1 / 3; grid-column: 2; }
.phone .rowhead .pv.none { min-height: 24px; }
.cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.phone .cards { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.card { font-family: var(--font-sans); font-size: 14px; text-align: left; border: 1px solid var(--rule-strong); background: var(--paper-raised); padding: 9px 10px; min-height: 40px; }
.card:hover { background: var(--panel); }
.card[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.tokens { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.token { font-family: var(--font-sans); font-size: 13px; border: 1px solid var(--rule-strong); background: var(--panel); padding: 3px 8px; }
.goto { margin-top: 8px; display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; font-size: 15.5px; border: 1px dashed var(--rule-strong); padding: 6px 10px; min-height: 48px; }
.seg { display: inline-flex; }
.seg button { font-family: var(--font-sans); font-size: 13px; font-weight: 500; border: 1px solid var(--ink); background: var(--paper-raised); padding: 5px 12px; min-height: 32px; }
.seg button + button { border-left: 0; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.hp { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; border-top: 1px solid var(--rule-strong); border-bottom: 1px solid var(--rule-strong); padding: 8px 0; }
.hp .tot { margin-left: auto; font-size: 17px; }
.hp .tot b { font-size: 22px; font-weight: 600; }
.hp .die { font-family: var(--font-sans); font-size: 12.5px; color: var(--ink-muted); }
.hp .tot small { letter-spacing: .06em; text-transform: uppercase; margin-right: 4px; }
.hp .tot small { font-family: var(--font-sans); font-size: 12px; color: var(--ink-muted); }
.hpgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 6px; padding: 10px 0 2px; }
.hpcell { display: grid; grid-template-columns: 1fr 30px; border: 1px solid var(--rule-strong); }
.hpcell label { grid-column: 1 / 3; font-family: var(--font-sans); font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-muted); padding: 2px 6px 0; }
.hpcell input { width: 100%; border: 0; background: none; font-size: 18px; padding: 0 6px 2px; min-width: 0; -moz-appearance: textfield; }
.hpcell input::-webkit-outer-spin-button, .hpcell input::-webkit-inner-spin-button { -webkit-appearance: none; }
.hpcell button { border: 0; border-left: 1px solid var(--rule); background: none; padding: 0; display: grid; place-items: center; }
.hpcell button:hover { background: var(--panel); }
.hpcell .fx { font-family: var(--font-sans); font-size: 10px; color: var(--ink-muted); display: grid; place-items: center; border-left: 1px solid var(--rule); }
.other li + li { border-top: 1px solid var(--rule); }
.other { border-top: 1px solid var(--rule-strong); border-bottom: 1px solid var(--rule-strong); }
.other button { width: 100%; background: none; border: 0; text-align: left; display: grid; grid-template-columns: 150px minmax(0, 1fr) auto; gap: 10px; align-items: center; min-height: 38px; padding: 4px 4px 4px 0; }
.phone .other button { grid-template-columns: 112px minmax(0, 1fr) auto; }
.other button:hover { background: var(--panel); }
.other .k { font-family: var(--font-sans); font-size: 14px; font-weight: 600; }
.other .v { font-size: 15.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.other .v.left { font-family: var(--font-sans); font-size: 12.5px; font-weight: 600; }
.other .to { font-family: var(--font-sans); font-size: 12.5px; color: var(--ink-muted); white-space: nowrap; text-decoration: underline; text-underline-offset: 3px; }
.add { width: 100%; border: 1px dashed var(--ink); background: none; min-height: 44px; font-family: var(--font-sans); font-size: 14px; font-weight: 500; display: flex; align-items: center; justify-content: center; gap: 8px; }
.add:hover { background: var(--panel); }

/* ---------- drawer, dialog, toast ---------- */
.wash { position: fixed; inset: 0; background: var(--wash); z-index: 40; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(440px, 100%); background: var(--paper); border-left: 1px solid var(--ink); box-shadow: -6px 0 0 var(--shadow); z-index: 41; padding: 14px 16px; overflow: auto; }
.drawer .top, .dlg .top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; gap: 10px; }
.drawer .detail { border: 0; padding: 0; background: none; }
.dlg { position: fixed; z-index: 41; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(820px, calc(100% - 24px)); max-height: calc(100% - 24px); overflow: auto; background: var(--paper); border: 1px solid var(--ink); box-shadow: 6px 6px 0 var(--shadow); padding: 16px 18px; }
.dlg.narrow { width: min(460px, calc(100% - 24px)); }
.dlg.mid { width: min(540px, calc(100% - 24px)); }
.detail.bare { border: 0; padding: 0; background: none; }
.dlg h3.t { font-size: 22px; font-weight: 600; }
.dlg .cols { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); gap: 16px; align-items: start; }
.phonemode .dlg .cols { grid-template-columns: 1fr; }
.dlg .list { border: 1px solid var(--rule-strong); background: var(--paper-raised); }
.dlg .list button { width: 100%; background: none; border: 0; text-align: left; padding: 8px 12px; font-family: var(--font-sans); font-size: 14px; display: flex; justify-content: space-between; gap: 8px; min-height: 40px; align-items: center; }
.dlg .list button + button { border-top: 1px solid var(--rule); }
.dlg .list button:hover { background: var(--panel); }
.dlg .list button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.dlg .list small { opacity: .7; font-size: 11.5px; }
.dlg .lose { margin: 10px 0 14px; border-top: 1px solid var(--rule-strong); }
.dlg .lose li { border-bottom: 1px solid var(--rule); padding: 4px 0; font-size: 16px; display: flex; gap: 10px; }
.dlg .lose li span { font-family: var(--font-sans); font-size: 12px; color: var(--ink-muted); min-width: 62px; padding-top: 4px; }
.dlg .act { display: flex; justify-content: flex-end; gap: 8px; margin-top: 12px; }
.toast { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); z-index: 50; background: var(--ink); color: var(--paper); font-family: var(--font-sans); font-size: 13.5px; padding: 8px 14px; box-shadow: 4px 4px 0 var(--shadow); max-width: calc(100% - 24px); }
</style>

    : `<div class="lvl"><div class="ll"></div><div class="rowhead" style="color:var(--ink-muted);font-family:var(--font-sans);font-size:13.5px">No choice at this level.</div></div>`;
  return `<section class="cls ${c.closed ? "closed" : ""}"><div class="clshead">
    <div class="nm">${px(icon, 32)}<span>${name}</span>${c.closed && left ? `<span class="count">${left}</span>` : ""}</div>
    <span class="lv"><span>Level</span><button class="btn sq" aria-label="Remove a ${name} level" data-lv="${ci}|-1" ${c.level <= 1 ? "disabled" : ""}>${px("minus")}</button><input type="number" min="1" max="20" value="${c.level}" aria-label="${name} level" data-lvin="${ci}"><button class="btn sq" aria-label="Add a ${name} level" data-lv="${ci}|1" ${c.level >= 20 ? "disabled" : ""}>${px("plus")}</button></span>
    <span style="display:inline-flex;gap:2px;align-items:center"><button class="btn ghost small" data-about="${c.key}">About</button><button class="btn ghost small" data-change="${ci}">Change</button>${many ? `<button class="btn ghost small" data-remove="${ci}">Remove</button><button class="btn sq" aria-label="${c.closed ? "Open" : "Close"} ${name}" data-fold="${ci}" style="font-family:var(--font-sans);font-size:12px">${c.closed ? "▾" : "▴"}</button>` : ""}</span></div>
    <div class="clsbody"><div class="sec"><h4>Choices</h4>${rows}</div>${hpSec(c, ci)}
    <div class="sec"><h4>Picked on other steps</h4>${others(c).length ? "" : `<p class="sans" style="font-size:13.5px;color:var(--ink-muted);border-top:1px solid var(--rule-strong);border-bottom:1px solid var(--rule-strong);padding:8px 0">A second class gives no pick on another step here.</p>`}<ul class="other" ${others(c).length ? "" : "hidden"}>${others(c).map(([k, v, to, left]) => `<li><button data-goto="${to}"><span class="k">${k}</span><span class="v ${left ? "left" : ""}">${left ? `<span class="count">${v}</span>` : v}</span><span class="to">${to}</span></button></li>`).join("")}</ul></div></div></section>`;
}
function page() {
  const total = S.classes.length ? S.classes.reduce((a, c) => a + leftOf(c), 0) : 1;
  const steps = [["Name", ""], ["Class", total || ""], ["Background", 1], ["Race", 1], ["Abilities", ""], ["Proficiencies", 3], ["Feats", "dim"], ["Spells", S.classes.some((c) => others(c).some((o) => o[0] === "Spells")) ? 4 : "dim"], ["Equipment", 2], ["Description", ""]];
  const rail = `<nav aria-label="Steps"><ol class="rail">${steps.map(([n, m], i) => `<li><span class="s ${n === "Class" ? "cur" : ""} ${m === "dim" ? "dim" : ""}"><span class="n">${i + 1}</span>${n}${m && m !== "dim" ? `<span class="count">${m}</span>` : ""}</span></li>`).join("")}</ol></nav>`;
  const body = S.classes.length ? S.classes.map(cls).join("") + (S.classes.length < 12 ? `<button class="add" data-add>${px("plus")}Add a class</button>` : "") : pickArea();
  const lv = S.classes.map((c) => `${CL[c.key][0]} ${c.level}`).join(", ");
  const sum = `<aside class="sum"><p class="lab">Summary</p><div class="sheet"><div class="nm">Mira Thorn</div><ul><li><span>Class</span><span>${lv || "&nbsp;"}</span></li><li><span>Level</span><span>${S.classes.reduce((a, c) => a + c.level, 0) || "&nbsp;"}</span></li><li><span>Hit points</span><span>${S.classes.reduce((a, c) => a + hpOf(c), 0) || "&nbsp;"}</span></li><li><span>Background</span><span>&nbsp;</span></li><li><span>Race</span><span>&nbsp;</span></li></ul></div><p style="margin-top:8px"><button class="btn" style="width:100%" data-goto="the full sheet">Open the full sheet</button></p></aside>`;
  return `${rail}<div class="two"><section><div class="h2row"><h2>Class</h2><span class="of">Step 2 of 10</span></div>${body}
    <div class="navrow"><button class="btn" data-goto="Name">Back</button>${S.phone ? '<button class="btn" data-goto="the full sheet">Sheet</button>' : ""}<button class="btn solid" data-goto="Background">Next: Background</button></div></section>${sum}</div>`;
}
function overlay() {
  const o = S.over; if (!o) return "";
  const wash = `<div class="wash" data-close></div>`;
  if (o.type === "about" && S.variant === "d") return `${wash}<div class="dlg mid" role="dialog" aria-label="${CL[o.key][0]}"><div class="top"><p class="lab">Class</p><button class="btn small" data-close>${px("x")}Close</button></div><div class="detail bare">${detail(o.key, o.choose ? `<button class="btn solid" data-choose="${o.key}">${px("check")}Choose ${CL[o.key][0]}</button>` : "")}</div></div>`;
  if (o.type === "about") return `${wash}<aside class="drawer"><div class="top"><p class="lab">Class</p><button class="btn small" data-close>${px("x")}Close</button></div><div class="detail">${detail(o.key, o.choose ? `<button class="btn solid" data-choose="${o.key}">${px("check")}Choose ${CL[o.key][0]}</button>` : "")}</div></aside>`;
  if (o.type === "classdlg") { const owned = S.classes.map((c) => c.key), verb = o.ci === undefined ? "Add" : "Change to";
    return `${wash}<div class="dlg" role="dialog" aria-label="${o.ci === undefined ? "Add a class" : "Change the class"}"><div class="top"><h3 class="t">${o.ci === undefined ? "Add a class" : `Change ${CL[S.classes[o.ci].key][0]}`}</h3><button class="btn small" data-close>${px("x")}Close</button></div>
      <div class="cols">${tiles("c3", o.key, owned, o.ci === undefined || o.ci > 0)}<div class="detail ${S.phone ? "" : "fixed"}">${o.key ? detail(o.key, `<button class="btn solid" data-dlgok>${px("check")}${verb} ${CL[o.key][0]}</button>`) : `<p class="empty">Select a class to read about it. A class that the character cannot take shows what it needs.</p>`}</div></div></div>`; }
  if (o.type === "sub") { const c = S.classes[o.ci], ch = choices(c).find((x) => x.id === o.id), cur = o.key ?? c.picks[o.id] ?? ch.opts[0], [d, fl] = SUBTEXT[cur] ?? ["The text of the subclass.", ["The features by level."]];
    return `${wash}<div class="dlg" role="dialog" aria-label="${esc(ch.name)}"><div class="top"><h3 class="t">${esc(ch.name)}</h3><button class="btn small" data-close>${px("x")}Close</button></div>
      <div class="cols"><div class="list">${ch.opts.map((s) => `<button aria-pressed="${s === cur}" data-subsel="${esc(s)}"><span>${esc(s)}</span>${SUBTEXT[s]?.[0].startsWith("From") ? "<small>Vale of Ash</small>" : ""}</button>`).join("")}</div>
      <div class="detail"><h3>${esc(cur)}</h3><p class="d">${esc(d)}</p><ol class="fl"><li class="hd"><span>Level</span><span>Features</span></li>${fl.map((f) => { const [l, ...r] = f.split(" "); return `<li><span>${/^\d+$/.test(l) ? l : ""}</span><span>${esc(/^\d+$/.test(l) ? r.join(" ") : f)}</span></li>`; }).join("")}</ol>
      <div class="act"><button class="btn solid" data-subok="${esc(cur)}">${px("check")}Choose ${esc(cur)}</button></div></div></div></div>`; }
  if (o.type === "list") { const c = S.classes[o.ci], ch = choices(c).find((x) => x.id === o.id);
    return `${wash}<div class="dlg narrow" role="dialog" aria-label="${esc(ch.name)}"><div class="top"><h3 class="t">${esc(ch.name)}</h3><button class="btn small" data-close>${px("x")}Close</button></div>
      <div class="list">${ch.opts.map((s) => `<button aria-pressed="${c.picks[o.id] === s}" data-pick="${o.ci}|${o.id}|${esc(s)}"><span>${esc(s)}</span><small>${c.picks[o.id] === s ? "" : "Choose"}</small></button>`).join("")}</div></div>`; }
  if (o.type === "confirm") return `${wash}<div class="dlg narrow" role="alertdialog" aria-label="${esc(o.title)}"><h3 class="t">${esc(o.title)}</h3><p style="margin-top:6px">${esc(o.text)}</p>
      <ul class="lose">${o.lose.map(([l, t]) => `<li><span>${l}</span>${esc(t)}</li>`).join("")}</ul><div class="act"><button class="btn" data-close>Cancel</button><button class="btn solid" data-yes>${esc(o.yes)}</button></div></div>`;
  return "";
}

// ---------- actions ----------
let toastT;
function toast(t) { S.toast = t; clearTimeout(toastT); toastT = setTimeout(() => { S.toast = ""; render(); }, 2600); }
const lost = (c, from = 1) => choices(c).filter((ch) => ch.level >= from && c.picks[ch.id]).map((ch) => [`Level ${ch.level}`, `${ch.name}: ${c.picks[ch.id]}`]);
function setLevel(ci, n) {
  const c = S.classes[ci]; n = Math.max(1, Math.min(20, Math.round(n) || 1)); if (n === c.level) return;
  const apply = () => { const up = n > c.level; for (const id of Object.keys(c.picks)) if (Number(id.split("-")[0]) > n) { delete c.picks[id]; c.open.delete(id); } c.level = n; if (up) openLeft(c); };
  const lose = n < c.level ? lost(c, n + 1) : [];
  if (lose.length) S.over = { type: "confirm", title: `Lower ${CL[c.key][0]} to level ${n}?`, text: "These picks go:", lose, yes: "Remove", run: apply };
  else apply();
}
function setClass(ci, key) {
  const run = () => { if (ci === undefined) S.classes.push(openLeft(mk(key, 1))); else S.classes[ci] = openLeft(mk(key, 1)); S.preview = null; };
  const lose = ci === undefined ? [] : lost(S.classes[ci]);
  if (lose.length) S.over = { type: "confirm", title: `Replace ${CL[S.classes[ci].key][0]} with ${CL[key][0]}?`, text: `${CL[key][0]} starts at level 1. These picks go:`, lose, yes: "Replace", run };
  else { run(); S.over = null; }
}
function render() {
  document.getElementById("stage").className = `stage ${S.phone ? "phone" : ""}`;
  document.getElementById("stage").innerHTML = page();
  document.getElementById("over").className = S.phone ? "phonemode" : "";
  document.getElementById("over").innerHTML = overlay() + (S.toast ? `<div class="toast" role="status">${esc(S.toast)}</div>` : "");
  document.getElementById("note").innerHTML = VARIANTS[S.variant][1] + " The variants differ only while the character has no class: use <b>New, no class</b>. The other characters show the class after the pick, which is the same in each variant.";
  document.documentElement.dataset.protoTheme = S.dark ? "dark" : "light";
  for (const [id, cur] of [["g-variant", S.variant], ["g-char", S.char], ["g-close", S.autoclose ? "close" : "stay"], ["g-width", S.phone ? "phone" : "desktop"], ["g-theme", S.dark ? "dark" : "light"]])
    for (const b of document.getElementById(id).querySelectorAll("button")) b.setAttribute("aria-pressed", String(b.dataset.v === cur));
}
function group(id, items, on) {
  const g = document.getElementById(id);
  for (const [v, label] of items) { const b = document.createElement("button"); b.dataset.v = v; b.textContent = label; b.onclick = () => { on(v); S.over = null; render(); }; g.append(b); }
}
const load = (v) => { S.char = v; S.classes = CHARS[v][1](); S.preview = null; };
group("g-variant", Object.entries(VARIANTS).map(([k, v]) => [k, v[0]]), (v) => { S.variant = v; S.preview = null; history.replaceState(null, "", "#" + v); });
group("g-char", Object.entries(CHARS).map(([k, v]) => [k, v[0]]), load);
group("g-close", [["stay", "stays open"], ["close", "closes"]], (v) => { S.autoclose = v === "close"; });
group("g-width", [["desktop", "Desktop"], ["phone", "Phone"]], (v) => { S.phone = v === "phone"; });
group("g-theme", [["light", "Light"], ["dark", "Dark"]], (v) => { S.dark = v === "dark"; });

document.addEventListener("click", (e) => {
  const t = e.target.closest("[data-close],[data-tile],[data-choose],[data-row],[data-pick],[data-sub],[data-list],[data-subsel],[data-subok],[data-lv],[data-hpm],[data-roll],[data-rollall],[data-goto],[data-about],[data-change],[data-remove],[data-fold],[data-add],[data-dlgok],[data-yes]");
  if (!t || t.closest(".proto-top")) return; const d = t.dataset;
  if ("close" in d) S.over = null;
  else if (d.tile) {
    if (S.over?.type === "classdlg") S.over.key = d.tile;
    else if (S.variant === "c") setClass(undefined, d.tile);
    else if (S.variant === "a" && !S.phone) S.preview = d.tile;
    else S.over = { type: "about", key: d.tile, choose: true };
  }
  else if (d.choose) { S.over = null; setClass(undefined, d.choose); }
  else if ("dlgok" in d) { const { ci, key } = S.over; S.over = null; setClass(ci, key); }
  else if (d.row) { const [ci, id] = d.row.split("|"), o = S.classes[ci].open; o.has(id) ? o.delete(id) : o.add(id); }
  else if (d.pick) { const [ci, id, opt] = d.pick.split("|"), c = S.classes[ci]; c.picks[id] = opt; if (S.over?.type === "list") S.over = null; if (S.autoclose && !id.endsWith("asi")) c.open.delete(id); openLeft(c); }
  else if (d.sub) { const [ci, id] = d.sub.split("|"); S.over = { type: "sub", ci: Number(ci), id }; }
  else if (d.list) { const [ci, id] = d.list.split("|"); S.over = { type: "list", ci: Number(ci), id }; }
  else if (d.subsel) S.over.key = d.subsel;
  else if (d.subok) { const c = S.classes[S.over.ci]; c.picks[S.over.id] = d.subok; if (S.autoclose) c.open.delete(S.over.id); S.over = null; openLeft(c); }
  else if (d.lv) { const [ci, by] = d.lv.split("|"); setLevel(Number(ci), S.classes[ci].level + Number(by)); }
  else if (d.hpm) { const [ci, m] = d.hpm.split("|"); S.classes[ci].hp = m; }
  else if (d.roll) { const [ci, l] = d.roll.split("|"), c = S.classes[ci]; c.rolls[l] = 1 + Math.floor(Math.random() * CL[c.key][2]); }
  else if (d.rollall) { const c = S.classes[d.rollall]; for (let l = 1; l <= c.level; l++) c.rolls[l] = 1 + Math.floor(Math.random() * CL[c.key][2]); }
  else if (d.goto) toast(`In the app, this opens ${d.goto === "the full sheet" ? d.goto : "the " + d.goto + " step"}.`);
  else if (d.about) S.over = { type: "about", key: d.about };
  else if (d.change) S.over = { type: "classdlg", ci: Number(d.change), key: null };
  else if ("add" in d) S.over = { type: "classdlg", key: null };
  else if (d.remove) { const ci = Number(d.remove), c = S.classes[ci], lose = lost(c), run = () => S.classes.splice(ci, 1);
    if (lose.length) S.over = { type: "confirm", title: `Remove ${CL[c.key][0]}?`, text: "These picks go:", lose, yes: "Remove", run }; else run(); }
  else if (d.fold) { const c = S.classes[d.fold]; c.closed = !c.closed; }
  else if ("yes" in d) { const run = S.over.run; S.over = null; run(); }
  render();
});
document.addEventListener("change", (e) => {
  const d = e.target.dataset;
  if (d.lvin) setLevel(Number(d.lvin), Number(e.target.value));
  else if (d.hp) { const [ci, l] = d.hp.split("|"), c = S.classes[ci]; c.rolls[l] = Math.max(1, Math.min(CL[c.key][2], Number(e.target.value) || 1)); }
  else return;
  render();
});
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && S.over) { S.over = null; render(); } });
const h = location.hash.slice(1); if (VARIANTS[h]) S.variant = h;
render();
</script>
