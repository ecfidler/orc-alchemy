<meta charset="utf-8">
<title>Builder Stepper Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400..700&display=swap">
<style>
/* PROTOTYPE (ORC-330), throwaway. Three variants of the builder page: the stepper, the place for the picks that are left, and the sheet preview.
   Paper theme (docs/design/theme.md). Light is the default; dark is only the Theme toggle here.
   Hash: #<variant> a, b, c or d. D is the combination that the owner chose on 2026-11-25. */
:root {
  --paper: #fffcf5; --paper-raised: #ffffff; --ink: #222222; --ink-muted: #595959;
  --rule: #e3dece; --rule-strong: #8a8578; --danger: #c2271d; --success: #1f7a3a; --info: #1e5fb4;
  --note: #ffe45c; --note-ink: #222222;
  --panel: color-mix(in srgb, var(--ink) 6%, var(--paper));
  --wash: color-mix(in srgb, var(--ink) 40%, transparent);
  --shadow: rgba(60, 45, 0, 0.22);
  --proto-bg: #1c2b4a; --proto-fg: #ffffff;
  --font-serif: "Newsreader", Georgia, "Times New Roman", serif;
  --font-sans: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
}
:root[data-proto-theme="dark"] {
  color-scheme: dark; --paper: #000000; --paper-raised: #0a0a0a; --ink: #ffffff; --ink-muted: #adadad;
  --rule: #222222; --rule-strong: #6b6b6b; --danger: #ff5c52; --success: #4ed07a; --info: #5ea2ff;
  --note-ink: #000000; --wash: rgba(255, 255, 255, 0.22); --shadow: rgba(255, 255, 255, 0.12);
  --proto-bg: #dfe8ff; --proto-fg: #0b1430;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--font-serif); font-size: 17px; line-height: 1.5;
  font-weight: 450; font-variant-numeric: lining-nums tabular-nums; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
h1, h2, h3, p, ul, ol { margin: 0; }
ul, ol { padding: 0; list-style: none; }
:focus-visible { outline: 2px solid var(--info); outline-offset: 2px; }

/* ---------- prototype chrome (not part of the design) ---------- */
.gut { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.proto-top { font-family: var(--font-sans); font-size: 12.5px; background: var(--proto-bg); color: var(--proto-fg);
  padding-block: 8px; display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; }
.proto-group { display: inline-flex; gap: 4px; align-items: center; flex-wrap: wrap; }
.proto-group > span { opacity: .75; margin-right: 2px; }
.proto-top button { background: transparent; border: 1px solid currentColor; border-radius: 999px; padding: 1px 10px; font-size: 12px; }
.proto-top button[aria-pressed="true"] { background: var(--proto-fg); color: var(--proto-bg); }
.proto-notes { font-family: var(--font-sans); font-size: 13px; line-height: 1.45; background: var(--panel); border-bottom: 1px solid var(--rule); padding-block: 8px; }
.proto-notes b { font-weight: 600; }
.proto-notes p { max-width: 100ch; }

/* ---------- shared parts ---------- */
.stagewrap { padding-block: 18px 60px; }
.stage { position: relative; width: 100%; max-width: 1120px; margin: 0 auto; }
.stage.phone { max-width: 390px; outline: 1px dashed var(--rule-strong); outline-offset: 8px; }
.sans { font-family: var(--font-sans); }
.btn { font-family: var(--font-sans); font-size: 13.5px; font-weight: 500; border: 1px solid var(--ink); background: var(--paper-raised); padding: 7px 14px; border-radius: 0; white-space: nowrap; min-height: 36px; }
.btn:hover { background: var(--panel); }
.btn.solid { background: var(--ink); color: var(--paper); }
.btn.solid:hover { background: color-mix(in srgb, var(--ink) 85%, var(--paper)); }
.btn:disabled { opacity: .35; cursor: default; }
.count { display: inline-block; font-family: var(--font-sans); font-size: 11.5px; font-weight: 600; line-height: 18px; min-width: 18px; padding: 0 5px; text-align: center;
  background: var(--note); color: var(--note-ink); border-radius: 9px; }
.count.over { background: var(--danger); color: #fff; }
.count.none { visibility: hidden; }
.h2row { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; border-bottom: 1px solid var(--rule-strong); padding-bottom: 6px; margin-bottom: 14px; }
.h2row h2 { font-size: 26px; font-weight: 600; line-height: 1.2; }
.h2row .of { font-family: var(--font-sans); font-size: 12.5px; color: var(--ink-muted); white-space: nowrap; }
.sel { margin-bottom: 20px; }
.selhead { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 6px; }
.selhead h3 { font-family: var(--font-sans); font-size: 15px; font-weight: 700; }
.selhead .st { font-family: var(--font-sans); font-size: 12.5px; color: var(--ink-muted); min-width: 92px; text-align: right; white-space: nowrap; }
.selhead .st.left { color: var(--ink); font-weight: 600; }
.selhead .st.over { color: var(--danger); font-weight: 600; }
.cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.phone .cards { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.card { font-family: var(--font-sans); font-size: 14px; text-align: left; border: 1px solid var(--rule-strong); background: var(--paper-raised); padding: 9px 10px; min-height: 40px; }
.card:hover { background: var(--panel); }
.card[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.field { display: grid; gap: 4px; max-width: 360px; }
.field span { font-family: var(--font-sans); font-size: 13px; font-weight: 600; }
.field input { border: 1.5px solid var(--ink); background: var(--paper-raised); padding: 7px 10px; font-size: 18px; border-radius: 0; }
.ph { border: 1px dashed var(--rule-strong); padding: 18px; color: var(--ink-muted); font-family: var(--font-sans); font-size: 13.5px; }
.nav { display: flex; gap: 8px; }
.navrow { display: flex; justify-content: space-between; gap: 8px; border-top: 1px solid var(--rule); padding-top: 12px; margin-top: 4px; }

/* the small sheet that stands for the preview */
.sheet { border: 1.5px solid var(--rule-strong); border-radius: 6px; background: var(--paper-raised); padding: 12px 14px; font-size: 15px; }
.sheet .nm { font-size: 24px; font-weight: 500; line-height: 1.2; border-bottom: 1.5px solid var(--rule-strong); min-height: 31px; }
.sheet .sub { font-family: var(--font-sans); font-size: 12.5px; color: var(--ink-muted); min-height: 19px; margin-top: 2px; }
.sheet .abs { display: grid; grid-template-columns: repeat(6, 1fr); gap: 5px; margin: 10px 0; }
.sheet .ab { border: 1px solid var(--rule-strong); text-align: center; padding: 3px 0 1px; }
.sheet .ab b { display: block; font-size: 18px; font-weight: 500; line-height: 1.2; }
.sheet .ab i { font-style: normal; font-family: var(--font-sans); font-size: 9.5px; letter-spacing: .08em; color: var(--ink-muted); }
.sheet li { display: flex; justify-content: space-between; gap: 10px; border-bottom: 1px solid var(--rule); padding: 3px 0; }
.sheet li span:first-child { font-family: var(--font-sans); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-muted); align-self: center; }
.sheet li span:last-child { text-align: right; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.sheet .fake { height: 150px; margin-top: 10px; background: repeating-linear-gradient(var(--paper-raised) 0 21px, var(--rule) 21px 22px); }
.lab { font-family: var(--font-sans); font-size: 10.5px; font-weight: 500; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-muted); margin-bottom: 6px; }

/* ---------- A: a rail across the top, marks only, the sheet beside ---------- */
.A .rail { display: flex; border-bottom: 1px solid var(--rule-strong); margin-bottom: 18px; overflow-x: auto; scrollbar-width: thin; }
.A .rail li { flex: 1 0 auto; }
.A .rail button { width: 100%; background: none; border: 0; border-bottom: 3px solid transparent; padding: 8px 10px 7px; font-family: var(--font-sans); font-size: 13.5px; font-weight: 500;
  color: var(--ink-muted); display: inline-flex; align-items: center; justify-content: center; gap: 6px; white-space: nowrap; }
.A .rail button:hover { color: var(--ink); background: var(--panel); }
.A .rail button[aria-current="step"] { color: var(--ink); border-bottom-color: var(--ink); font-weight: 600; }
.A .rail .n { font-size: 11px; opacity: .7; }
.A .two { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 28px; align-items: start; }
.A.phone .two { grid-template-columns: 1fr; }
.A .two > aside { border-left: 1px solid var(--rule-strong); padding-left: 24px; }
.A.phone .two > aside { border-left: 0; padding-left: 0; border-top: 1px solid var(--rule-strong); padding-top: 14px; }

/* ---------- B: a list at the side with a status line, the sheet behind a button ---------- */
.B .three { display: grid; grid-template-columns: 216px minmax(0, 1fr); gap: 28px; align-items: start; }
.B.phone .three { grid-template-columns: 1fr; gap: 12px; }
.B .side { position: sticky; top: 8px; border: 1px solid var(--rule-strong); background: var(--paper-raised); }
.B .side .tot { font-family: var(--font-sans); font-size: 12.5px; padding: 8px 12px; border-bottom: 1px solid var(--rule-strong); background: var(--panel); display: flex; justify-content: space-between; gap: 8px; }
.B .side .tot b { font-weight: 600; }
.B .side li + li { border-top: 1px solid var(--rule); }
.B .side li button { width: 100%; background: none; border: 0; border-left: 4px solid transparent; text-align: left; padding: 6px 12px 6px 10px; display: grid; grid-template-columns: 20px 1fr; column-gap: 6px; height: 50px; align-content: center; }
.B .side li button:hover { background: var(--panel); }
.B .side li button[aria-current="step"] { border-left-color: var(--ink); background: var(--panel); }
.B .side .n { font-family: var(--font-sans); font-size: 12px; color: var(--ink-muted); grid-row: 1 / 3; align-self: start; padding-top: 3px; }
.B .side .nm { font-family: var(--font-sans); font-size: 14px; font-weight: 600; line-height: 1.3; }
.B .side .stt { font-family: var(--font-sans); font-size: 12px; color: var(--ink-muted); line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.B .side .stt.left { color: var(--ink); }
.B .side .stt.left::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--note); border: 1px solid var(--ink); margin-right: 5px; }
.B .side .stt.over { color: var(--danger); font-weight: 600; }
.B .phonepick { width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 8px; text-align: left; }
.B .phonepick small { font-weight: 400; color: var(--ink-muted); }
.B .h2row { align-items: center; flex-wrap: wrap; }
.B .nav { flex-wrap: wrap; }
.B .drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(440px, 100%); background: var(--paper); border-left: 1px solid var(--ink); box-shadow: -6px 0 0 var(--shadow); z-index: 40; padding: 14px 16px; overflow: auto; }
.B .drawer .top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
.B .sheetmenu { position: absolute !important; top: calc(100% + 4px) !important; left: 0; right: 0; z-index: 30; background: var(--paper-raised); border: 1px solid var(--ink); box-shadow: 4px 4px 0 var(--shadow); }
.B .rel { position: relative; }

.D .drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(440px, 100%); background: var(--paper); border-left: 1px solid var(--ink); box-shadow: -6px 0 0 var(--shadow); z-index: 40; padding: 14px 16px; overflow: auto; }
.D .drawer .top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
.stage.D { min-height: 0 !important; display: block !important; }
.D .two > aside { border-left: 0 !important; padding-left: 0 !important; border-top: 0 !important; padding-top: 0 !important; }
/* ---------- C: segments at the top, a bar at the bottom with a "left" menu, a summary card ---------- */
.C .segs { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; margin-bottom: 18px; }
.C .segs button { background: none; border: 0; padding: 0 0 4px; display: grid; gap: 5px; font-family: var(--font-sans); font-size: 12px; color: var(--ink-muted); text-align: left; min-width: 0; }
.C .segs .bar { height: 8px; background: var(--rule); border: 1px solid var(--rule-strong); }
.C .segs .bar.left { background: var(--note); border-color: var(--ink); }
.C .segs .bar.over { background: var(--danger); border-color: var(--danger); }
.C .segs button[aria-current="step"] { color: var(--ink); font-weight: 600; }
.C .segs button[aria-current="step"] .bar { outline: 2px solid var(--ink); outline-offset: 1px; }
.C .segs button:hover { color: var(--ink); }
.C .segs .t { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.C.phone .segs .t { display: none; }
.C .two { display: grid; grid-template-columns: minmax(0, 1fr) 260px; gap: 28px; align-items: start; }
.C.phone .two { grid-template-columns: 1fr; }
.C .sum { position: sticky; top: 8px; }
.C.phone .sum { display: none; }
.stage.C { min-height: calc(100vh - 170px); display: flex; flex-direction: column; }
.C .foot { margin-top: auto !important; }
.C .two { margin-bottom: 16px; }
.C .foot { position: sticky; bottom: 0; z-index: 20; margin-top: 16px; background: var(--paper); border-top: 1.5px solid var(--ink); padding: 10px 0; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; }
.C .foot > :last-child { justify-self: end; }
.C .foot > :first-child { justify-self: start; }
.C .leftbtn { min-width: 200px; display: inline-flex; justify-content: center; align-items: center; gap: 8px; }
.C.phone .leftbtn { min-width: 0; }
.C .pop { position: absolute; bottom: calc(100% + 6px); left: 0; right: 0; margin-inline: auto; width: min(340px, 100%); background: var(--paper-raised); border: 1px solid var(--ink); box-shadow: 4px 4px 0 var(--shadow); max-height: 320px; overflow: auto; }
.C .pop button { width: 100%; background: none; border: 0; text-align: left; padding: 8px 12px; font-family: var(--font-sans); font-size: 13.5px; display: flex; justify-content: space-between; gap: 10px; }
.C .pop button + button { border-top: 1px solid var(--rule); }
.C .pop button:hover { background: var(--panel); }
.C .pop small { color: var(--ink-muted); }
.C .pop .over { color: var(--danger); font-weight: 600; }
.C .pop p { padding: 10px 12px; font-family: var(--font-sans); font-size: 13.5px; color: var(--ink-muted); }
.C .mid { position: static; }
.C.phone .foot { grid-template-columns: auto 1fr auto; }
.C.phone .leftbtn { width: 100%; padding-inline: 6px; }
</style>

<div class="proto-top gut">
  <span class="proto-group" id="g-variant"><span>Variant</span></span>
  <span class="proto-group" id="g-char"><span>Character</span></span>
  <span class="proto-group" id="g-width"><span>Width</span></span>
  <span class="proto-group" id="g-theme"><span>Theme</span></span>
  <span class="proto-group"><button id="reset">Reset the picks</button></span>
</div>
<div class="proto-notes gut"><p id="note"></p></div>
<div class="stagewrap gut"><div class="stage" id="stage"></div></div>

<script>
// PROTOTYPE (ORC-330), throwaway. State is in memory only.
const VARIANTS = {
  a: ["A. Rail and marks", "<b>A. Rail and marks.</b> The steps are a rail across the top. No sentence says what is left: a yellow count is on the step, and each selection shows \"2 left\" beside its heading. Back and Next are under the step. The sheet stays beside the steps, as today."],
  b: ["B. Side list with a status line", "<b>B. Side list with a status line.</b> The steps are a list at the side. Each row has a fixed second line that says what is left, and the total is at the top of the list. Back and Next are beside the step title, so they never move. The sheet is behind a \"Show sheet\" button."],
  d: ["D. The picks of 2026-11-25", "<b>D. The picks of 2026-11-25.</b> The rail and the marks of A, with the summary card of C. \"Open the full sheet\" opens the sheet in a panel at the side. On a phone the card does not show, and a Sheet button is between Back and Next."],
  c: ["C. Segments and a bottom bar", "<b>C. Segments and a bottom bar.</b> The steps are thin segments. A bar stays at the bottom of the screen with Back, Next, and a \"picks left\" button that opens the list of what is left, each line a link to its step. A small summary card takes the place of the full sheet."],
};
const CLASS_OPTS = ["Barbarian", "Bard", "Cleric", "Druid", "Fighter", "Monk", "Paladin", "Ranger", "Rogue", "Sorcerer", "Warlock", "Wizard"];
const makeSteps = (caster) => [
  { name: "Name", kind: "name" },
  { name: "Class", sels: [
    { name: "Class", need: 1, opts: CLASS_OPTS, picked: [caster ? "Wizard" : "Fighter"] },
    { name: "Skill Proficiency", need: 2, multi: true, opts: caster ? ["Arcana", "History", "Insight", "Investigation", "Medicine", "Religion"] : ["Acrobatics", "Animal Handling", "Athletics", "History", "Insight", "Intimidation", "Perception", "Survival"], picked: [] },
    ...(caster ? [] : [{ name: "Fighting Style", need: 1, opts: ["Archery", "Defense", "Dueling", "Great Weapon Fighting", "Protection", "Two-Weapon Fighting"], picked: [] }]),
  ] },
  { name: "Background", sels: [
    { name: "Background", need: 1, opts: ["Acolyte", "Custom"], picked: [] },
    { name: "Languages", need: 2, multi: true, opts: ["Dwarvish", "Elvish", "Giant", "Gnomish", "Goblin", "Halfling", "Orc", "Draconic", "Infernal"], picked: [] },
  ] },
  { name: "Race", sels: [
    { name: "Race", need: 1, opts: ["Dragonborn", "Dwarf", "Elf", "Gnome", "Half-Elf", "Half-Orc", "Halfling", "Human", "Tiefling"], picked: [] },
  ] },
  { name: "Abilities", kind: "ph", text: "The ability score control is a different prototype (the ticket \"The ability score control\")." },
  { name: "Feats", kind: "ph", text: "No feat to pick at level 1." },
  ...(caster ? [{ name: "Spells", sels: [
    { name: "Cantrips Known", need: 3, multi: true, opts: ["Acid Splash", "Fire Bolt", "Light", "Mage Hand", "Minor Illusion", "Prestidigitation", "Ray of Frost", "Shocking Grasp"], picked: [] },
    { name: "Spellbook, 1st level", need: 6, multi: true, opts: ["Burning Hands", "Charm Person", "Detect Magic", "Feather Fall", "Identify", "Mage Armor", "Magic Missile", "Shield", "Sleep", "Thunderwave"], picked: [] },
  ] }] : []),
  { name: "Equipment", sels: [
    { name: "Starting equipment: weapon", need: 1, opts: caster ? ["Quarterstaff", "Dagger"] : ["Chain mail", "Leather armor, longbow, 20 arrows"], picked: [] },
    { name: "Starting equipment: pack", need: 1, opts: caster ? ["Scholar's pack", "Explorer's pack"] : ["Dungeoneer's pack", "Explorer's pack"], picked: [] },
  ] },
  { name: "Description", kind: "ph", text: "Alignment, looks, personality and backstory fields." },
];
const S = { variant: "d", caster: true, phone: false, dark: false, step: 1, name: "", steps: makeSteps(true), open: null };

const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const remOf = (sel) => sel.need - sel.picked.length;           // above 0: picks to make; below 0: picks to remove
const stepRem = (st) => (st.sels ?? []).reduce((a, s) => { const r = remOf(s); return { left: a.left + Math.max(r, 0), over: a.over + Math.max(-r, 0) }; }, { left: 0, over: 0 });
const total = () => S.steps.reduce((a, st) => { const r = stepRem(st); return { left: a.left + r.left, over: a.over + r.over }; }, { left: 0, over: 0 });
const picks = (n) => (n === 1 ? "1 pick" : n + " picks");
const pickedOf = (step, sel) => S.steps.find((s) => s.name === step)?.sels?.find((s) => s.name === sel)?.picked ?? [];

function countMark(st) {
  const r = stepRem(st);
  if (r.over) return `<span class="count over" title="${r.over} too many">${r.over} over</span>`;
  if (r.left) return `<span class="count" title="${picks(r.left)} left">${r.left}</span>`;
  return "";
}
function statusText(r) { return r.over ? [`Remove ${r.over}`, "over"] : r.left ? [`${picks(r.left)} left`, "left"] : ["", ""]; }

function body() {
  const st = S.steps[S.step];
  if (st.kind === "name") return `<label class="field"><span>Character name</span><input id="nameinput" value="${esc(S.name)}" placeholder="Unnamed character"></label>`;
  if (st.kind === "ph") return `<p class="ph">${esc(st.text)}</p>`;
  return st.sels.map((sel, i) => {
    const r = remOf(sel);
    const [txt, cls] = r < 0 ? [`Remove ${-r}`, "over"] : r > 0 ? [`${r} left`, "left"] : ["Done", ""];
    return `<section class="sel"><div class="selhead"><h3>${esc(sel.name)}</h3><span class="st ${cls}">${txt}</span></div>
      <div class="cards">${sel.opts.map((o) => `<button class="card" aria-pressed="${sel.picked.includes(o)}" data-sel="${i}" data-opt="${esc(o)}">${esc(o)}</button>`).join("")}</div></section>`;
  }).join("");
}
function nav() {
  const last = S.step === S.steps.length - 1;
  return [`<button class="btn" data-go="${S.step - 1}" ${S.step === 0 ? "disabled" : ""}>Back</button>`,
    last ? `<button class="btn solid" data-done>Go to the sheet</button>` : `<button class="btn solid" data-go="${S.step + 1}">${S.phone && S.variant === "c" ? "Next" : "Next: " + esc(S.steps[S.step + 1].name)}</button>`];
}
function sheetFacts() {
  return [["Class", (pickedOf("Class", "Class")[0] ?? "") + " 1"], ["Background", pickedOf("Background", "Background")[0] ?? ""], ["Race", pickedOf("Race", "Race")[0] ?? ""],
    ["Skills", pickedOf("Class", "Skill Proficiency").join(", ")], ["Languages", ["Common", ...pickedOf("Background", "Languages")].join(", ")]];
}
function sheet(full) {
  const sc = [15, 14, 13, 12, 10, 8], ab = ["STR", "DEX", "CON", "INT", "WIS", "CHA"];
  return `<div class="sheet"><div class="nm">${esc(S.name || "Unnamed character")}</div>
    <div class="sub">${esc([pickedOf("Race", "Race")[0], pickedOf("Class", "Class")[0] + " 1"].filter(Boolean).join(" "))}</div>
    <div class="abs">${ab.map((a, i) => `<div class="ab"><b>${sc[i]}</b><i>${a}</i></div>`).join("")}</div>
    <ul>${sheetFacts().map(([k, v]) => `<li><span>${k}</span><span>${esc(v) || "&nbsp;"}</span></li>`).join("")}</ul>
    ${full ? '<div class="fake" aria-hidden="true"></div>' : ""}</div>`;
}
const h2row = (extra = "") => `<div class="h2row"><h2>${esc(S.steps[S.step].name)}</h2>${extra || `<span class="of">Step ${S.step + 1} of ${S.steps.length}</span>`}</div>`;

const drawer = () => S.open === "sheet" ? `<aside class="drawer"><div class="top"><p class="lab">Sheet</p><button class="btn" data-open="sheet">Close</button></div>${sheet(true)}</aside>` : "";
const RENDER = {
  d() {
    const [back, next] = nav();
    return `<nav aria-label="Steps"><ol class="rail">${S.steps.map((st, i) => `<li><button data-go="${i}" ${i === S.step ? 'aria-current="step"' : ""}><span class="n">${i + 1}</span>${esc(st.name)}${countMark(st)}</button></li>`).join("")}</ol></nav>
      <div class="two"><section>${h2row()}${body()}<div class="navrow">${back}${S.phone ? '<button class="btn" data-open="sheet">Sheet</button>' : ""}${next}</div></section>
      <aside class="sum"><p class="lab">Summary</p>${sheet(false)}<p style="margin-top:8px"><button class="btn" style="width:100%" data-open="sheet">Open the full sheet</button></p></aside></div>${drawer()}`;
  },
  a() {
    const [back, next] = nav();
    return `<nav aria-label="Steps"><ol class="rail">${S.steps.map((st, i) => `<li><button data-go="${i}" ${i === S.step ? 'aria-current="step"' : ""}><span class="n">${i + 1}</span>${esc(st.name)}${countMark(st)}</button></li>`).join("")}</ol></nav>
      <div class="two"><section>${h2row()}${body()}<div class="navrow">${back}${next}</div></section>
      <aside><p class="lab">Sheet preview</p>${sheet(true)}</aside></div>`;
  },
  b() {
    const [back, next] = nav(), t = total();
    const tot = [t.left ? `${picks(t.left)} left` : "", t.over ? `remove ${t.over}` : ""].filter(Boolean).join(", ") || "Every pick is made";
    const rows = S.steps.map((st, i) => { const [txt, cls] = statusText(stepRem(st)); return `<li><button data-go="${i}" ${i === S.step ? 'aria-current="step"' : ""}><span class="n">${i + 1}</span><span class="nm">${esc(st.name)}</span><span class="stt ${cls}">${txt || "&nbsp;"}</span></button></li>`; }).join("");
    const list = `<div class="tot"><b>${tot}</b></div><ol>${rows}</ol>`;
    const side = S.phone
      ? `<div class="rel"><button class="btn phonepick" data-open="steps"><span>${S.step + 1}. ${esc(S.steps[S.step].name)} <small>of ${S.steps.length}</small></span><span>${tot} ▾</span></button>${S.open === "steps" ? `<div class="sheetmenu side">${list}</div>` : ""}</div>`
      : `<nav class="side" aria-label="Steps">${list}</nav>`;
    return `<div class="three">${side}<section>${h2row(`<span class="nav"><button class="btn" data-open="sheet">Show sheet</button>${back}${next}</span>`)}${body()}</section></div>
      ${S.open === "sheet" ? `<aside class="drawer"><div class="top"><p class="lab">Sheet</p><button class="btn" data-open="sheet">Close</button></div>${sheet(true)}</aside>` : ""}`;
  },
  c() {
    const [back, next] = nav(), t = total();
    const segs = S.steps.map((st, i) => { const r = stepRem(st); return `<button data-go="${i}" ${i === S.step ? 'aria-current="step"' : ""} title="${esc(st.name)}"><span class="bar ${r.over ? "over" : r.left ? "left" : ""}"></span><span class="t">${esc(st.name)}</span></button>`; }).join("");
    const lines = S.steps.flatMap((st, i) => (st.sels ?? []).filter((s) => remOf(s) !== 0).map((s) => { const r = remOf(s); return `<button data-go="${i}"><span>${esc(s.name)} <small>${esc(st.name)}</small></span><span class="${r < 0 ? "over" : ""}">${r < 0 ? `remove ${-r}` : `${r} left`}</span></button>`; }));
    const label = [t.left ? `<span class="count">${t.left}</span> left` : "", t.over ? `<span class="count over">${t.over}</span> to remove` : ""].filter(Boolean).join(" ") || "Every pick is made";
    return `<nav class="segs" aria-label="Steps">${segs}</nav>
      <div class="two"><section>${h2row()}${body()}</section><aside class="sum"><p class="lab">Summary</p>${sheet(false)}<p style="margin-top:8px"><button class="btn" style="width:100%">Open the full sheet</button></p></aside></div>
      <div class="foot">${back}<span class="mid"><button class="btn leftbtn" data-open="left">${label} ▴</button>${S.open === "left" ? `<div class="pop">${lines.join("") || "<p>Nothing is left to pick.</p>"}</div>` : ""}</span>${next}</div>`;
  },
};

function render() {
  const stage = document.getElementById("stage");
  stage.className = `stage ${S.variant === "d" ? "A C D" : S.variant.toUpperCase()} ${S.phone ? "phone" : ""}`;
  stage.innerHTML = RENDER[S.variant]();
  document.getElementById("note").innerHTML = VARIANTS[S.variant][1] + " Click the options: the counts change and the page must not move.";
  document.documentElement.dataset.protoTheme = S.dark ? "dark" : "light";
  for (const [id, cur] of [["g-variant", S.variant], ["g-char", S.caster ? "caster" : "fighter"], ["g-width", S.phone ? "phone" : "desktop"], ["g-theme", S.dark ? "dark" : "light"]])
    for (const b of document.getElementById(id).querySelectorAll("button")) b.setAttribute("aria-pressed", String(b.dataset.v === cur));
}
function group(id, items, on) {
  const g = document.getElementById(id);
  for (const [v, label] of items) { const b = document.createElement("button"); b.dataset.v = v; b.textContent = label; b.onclick = () => { on(v); S.open = null; render(); }; g.append(b); }
}
group("g-variant", Object.entries(VARIANTS).map(([k, v]) => [k, v[0]]), (v) => { S.variant = v; history.replaceState(null, "", "#" + v); });
group("g-char", [["caster", "Wizard (has Spells)"], ["fighter", "Fighter (no Spells)"]], (v) => { S.caster = v === "caster"; S.steps = makeSteps(S.caster); S.step = Math.min(S.step, S.steps.length - 1); });
group("g-width", [["desktop", "Desktop"], ["phone", "Phone"]], (v) => { S.phone = v === "phone"; });
group("g-theme", [["light", "Light"], ["dark", "Dark"]], (v) => { S.dark = v === "dark"; });
document.getElementById("reset").onclick = () => { S.steps = makeSteps(S.caster); S.name = ""; S.open = null; render(); };

document.getElementById("stage").addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.go !== undefined) { S.step = Number(b.dataset.go); S.open = null; }
  else if (b.dataset.open) S.open = S.open === b.dataset.open ? null : b.dataset.open;
  else if (b.dataset.sel !== undefined) {
    const sel = S.steps[S.step].sels[Number(b.dataset.sel)], o = b.dataset.opt;
    if (sel.multi) sel.picked = sel.picked.includes(o) ? sel.picked.filter((p) => p !== o) : [...sel.picked, o];   // a multiselect can go over, to show the red mark
    else sel.picked = [o];
  } else return;
  render();
});
document.getElementById("stage").addEventListener("change", (e) => { if (e.target.id === "nameinput") { S.name = e.target.value; render(); } });
const h = location.hash.slice(1); if (VARIANTS[h]) S.variant = h;
render();
</script>
