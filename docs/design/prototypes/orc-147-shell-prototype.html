<title>Alchemy App Shell</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,200..800;1,6..72,200..800&family=Inter:wght@400;500;600&display=swap">
<style>
/* PROTOTYPE (ORC-147), throwaway. Round 2: Ethan picked shell C "Binder" (2026-10-17).
   Alerts are flat, banner-shaped sticky notes: yellow = act on it, red = something failed, blue = information.
   The logo is a 16 x 16 pixel-art potion (Ethan's art), scaled only by whole powers of two. Palette is ORC-144 "Highlighter". */
:root {
  --paper: #FFFCF5; --paper-raised: #FFFFFF; --ink: #222222; --ink-muted: #595959;
  --rule: #E3DECE; --rule-strong: #8A8578;
  --danger: #C2271D; --success: #1F7A3A; --info: #1E5FB4; --warning: #7F6200;
  --note: #FFE45C; --note-red: #FFB3A8; --note-blue: #A9CCFF; --note-ink: #222222;
  --note-shadow: rgba(60, 45, 0, .20);
  --margin-rule: #C2271D;
  --flag-yellow: #FFE45C; --flag-blue: #7FB6FF; --flag-green: #7EE08F; --flag-orange: #FFAE5C; --flag-ink: #222222;
  --potion-ink: #222222; --potion-cork: #9C6B3C; --potion-glass: #DCEFE2; --potion-glint: #FFFFFF; --potion-liquid: #2E8B4A; --potion-bubble: #8FD9A6;
  --bar: #222222; --bar-fg: #FFFCF5;
  --panel: color-mix(in srgb, var(--ink) 6%, var(--paper));
  --serif: "Newsreader", Georgia, "Times New Roman", serif;
  --sans: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --grain-opacity: .05;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #000000; --paper-raised: #0A0A0A; --ink: #FFFFFF; --ink-muted: #ADADAD; --rule: #222222; --rule-strong: #6B6B6B;
  --danger: #FF5C52; --success: #4ED07A; --info: #5EA2FF; --warning: #FFD93D;
  --note: #FFE45C; --note-red: #FF9C8F; --note-blue: #9CC4FF; --note-ink: #000000; --note-shadow: rgba(255, 255, 255, .10);
  --margin-rule: #FF5C52; --potion-ink: #E8E8E8; --potion-glass: #10301B; --potion-glint: #CFEFD8; --potion-liquid: #4ED07A; --potion-bubble: #B6F0C8;
  --flag-ink: #000000;
  --bar: #FFFFFF; --bar-fg: #000000; --grain-opacity: .07; color-scheme: dark } }
:root[data-theme="dark"] {
  --paper: #000000; --paper-raised: #0A0A0A; --ink: #FFFFFF; --ink-muted: #ADADAD; --rule: #222222; --rule-strong: #6B6B6B;
  --danger: #FF5C52; --success: #4ED07A; --info: #5EA2FF; --warning: #FFD93D;
  --note: #FFE45C; --note-red: #FF9C8F; --note-blue: #9CC4FF; --note-ink: #000000; --note-shadow: rgba(255, 255, 255, .10);
  --margin-rule: #FF5C52; --potion-ink: #E8E8E8; --potion-glass: #10301B; --potion-glint: #CFEFD8; --potion-liquid: #4ED07A; --potion-bubble: #B6F0C8;
  --flag-ink: #000000;
  --bar: #FFFFFF; --bar-fg: #000000; --grain-opacity: .07; color-scheme: dark }

html { background: var(--paper); }
body { background: var(--paper); color: var(--ink); font-family: var(--serif); font-weight: 450; font-size: 17px; line-height: 1.5; font-optical-sizing: auto; min-height: 100%; }
body::after { content: ""; position: fixed; inset: 0; pointer-events: none; opacity: var(--grain-opacity); z-index: 0;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .5  0 0 0 0 .5  0 0 0 0 .5  0 0 0 1 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }
h1, h2, h3 { margin: 0; font-weight: 500; text-wrap: balance; }
p { margin: 0; }
a { color: inherit; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--info); outline-offset: 2px; }
.lbl { font-family: var(--sans); font-size: 10.5px; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-muted); line-height: 1.2; }
.muted { color: var(--ink-muted); }
.num { font-variant-numeric: tabular-nums; }
.proto { font-family: var(--sans); font-size: 12px; color: var(--ink-muted); letter-spacing: .02em; max-width: 72ch; margin-bottom: 14px; }
.proto b { color: var(--ink); font-weight: 600; }

/* ---------- pixel potion (placeholder for Ethan's 16 x 16 art) ---------- */
.potion { flex: none; display: block; image-rendering: pixelated; shape-rendering: crispEdges; }
.mark { display: inline-flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); }
.word { font-family: var(--serif); font-weight: 560; font-size: 20px; letter-spacing: -.01em; line-height: 1; white-space: nowrap; }
.word small { font-family: var(--sans); font-size: 10px; font-weight: 600; letter-spacing: .1em; margin-left: 4px; color: var(--ink-muted); vertical-align: 3px; }

/* ---------- shell C: binder margin ---------- */
/* Nav = page-marker flags stuck to the margin rule: a see-through body, an opaque stuck end at the rule. The current page sticks out further. */
.nav { display: grid; gap: 9px; font-family: var(--sans); font-size: 13.5px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; margin-right: -17.5px; justify-items: end; position: relative; z-index: 2; }
.nav a { --c: var(--flag-yellow); display: block; width: calc(100% - 14px); box-sizing: border-box; text-decoration: none; color: var(--flag-ink); padding: 11px 14px 11px 16px;
  background: linear-gradient(90deg, color-mix(in srgb, var(--c) 55%, #FFFFFF) 0 68%, var(--c) 68% 100%);
  transition: width .15s ease; }
.nav a:hover { width: calc(100% - 6px); }
.nav a[aria-current="page"] { width: calc(100% + 4px); background: var(--c); box-shadow: 0 3px 6px -4px var(--note-shadow); }
.nav.arrow a { clip-path: polygon(14px 0, 100% 0, 100% 100%, 14px 100%, 0 50%); padding-left: 24px; }
.nav.multi a:nth-child(2) { --c: var(--flag-blue); }
.nav.multi a:nth-child(3) { --c: var(--flag-green); }
.nav.multi a:nth-child(4) { --c: var(--flag-orange); }
.nav a:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { .nav a { transition: none; } }
.grid { position: relative; z-index: 1; display: grid; grid-template-columns: 200px minmax(0, 1fr); min-height: 100vh; }
.rail { border-right: 1.5px solid var(--margin-rule); position: relative; padding: 20px 16px 20px max(16px, env(safe-area-inset-left, 0px)); display: grid; align-content: start; gap: 22px; }
.rail::after { content: ""; position: absolute; top: 0; bottom: 0; right: 4px; border-right: 1px solid color-mix(in srgb, var(--margin-rule) 45%, transparent); }
.main { min-width: 0; padding: 20px max(16px, env(safe-area-inset-right, 0px)) 160px 28px; }
.inner { max-width: 760px; }
@media (max-width: 680px) {
  .grid { grid-template-columns: minmax(0, 1fr); min-height: 0; }
  .rail { border-right: 0; border-bottom: 1.5px solid var(--margin-rule); padding: 14px max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px)); gap: 8px; }
  .rail::after { top: auto; bottom: 3px; left: 0; right: 0; border-right: 0; border-bottom: 1px solid color-mix(in srgb, var(--margin-rule) 45%, transparent); }
  .nav { grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); align-items: end; margin-right: 0; margin-bottom: -11.5px; gap: 6px; font-size: 11px; letter-spacing: .04em; }
  .nav a { width: auto; height: 54px; padding: 10px 4px 0; text-align: center; overflow-wrap: anywhere;
    background: linear-gradient(180deg, color-mix(in srgb, var(--c) 55%, #FFFFFF) 0 62%, var(--c) 62% 100%); }
  .nav a:hover { width: auto; }
  .nav a[aria-current="page"] { width: auto; height: 64px; }
  .nav.arrow a { clip-path: polygon(50% 0, 100% 10px, 100% 100%, 0 100%, 0 10px); padding-left: 4px; padding-top: 14px; }
  .main { padding: 16px max(16px, env(safe-area-inset-right, 0px)) 300px max(16px, env(safe-area-inset-left, 0px)); }
}

/* ---------- alerts: flat banner-shaped sticky notes ---------- */
.alerts { display: grid; gap: 10px; margin-bottom: 16px; }
.alerts:empty { display: none; }
.note { --c: var(--note); position: relative; display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px; background: var(--c); color: var(--note-ink);
  padding: 11px 40px 12px 14px; font-family: var(--sans); font-size: 13.5px; line-height: 1.4; font-weight: 500;
  box-shadow: 0 4px 8px -5px var(--note-shadow); clip-path: polygon(0 0, 100% 0, 100% calc(100% - 12px), calc(100% - 12px) 100%, 0 100%); }
.note::after { content: ""; position: absolute; right: 0; bottom: 0; width: 12px; height: 12px; background: linear-gradient(135deg, color-mix(in srgb, var(--c) 72%, #000) 50%, transparent 50%); }
.note.red { --c: var(--note-red); }
.note.blue { --c: var(--note-blue); }
.note .k { font-size: 10px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; flex: none; }
.note .msg { flex: 1 1 22ch; min-width: 0; }
.note b { font-weight: 700; }
.note .act { all: unset; cursor: pointer; text-decoration: underline; text-underline-offset: 2px; font-weight: 700; }
.note .x { all: unset; cursor: pointer; position: absolute; right: 10px; top: 8px; font-size: 18px; line-height: 1; padding: 2px 4px; }
.note .act:focus-visible, .note .x:focus-visible { outline: 2px solid var(--note-ink); outline-offset: 1px; }

/* ---------- page body: the character list ---------- */
.page-top { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 10px; }
.page h1 { font-size: 30px; }
.btn { font-family: var(--sans); font-size: 13px; font-weight: 600; border: 1.5px solid var(--ink); background: var(--ink); color: var(--paper); border-radius: 6px; padding: 7px 14px; cursor: pointer; }
.list { list-style: none; margin: 16px 0 0; padding: 0; border-top: 1.5px solid var(--rule-strong); }
.list li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 16px; align-items: baseline; padding: 10px 2px; border-bottom: 1px solid var(--rule); }
.list .name { font-size: 19px; font-weight: 500; }
.list .who { grid-column: 1; font-size: 14.5px; color: var(--ink-muted); }
.list .lv { grid-column: 2; grid-row: 1 / span 2; align-self: center; text-align: right; }
.list .lv b { display: block; font-size: 24px; font-weight: 500; line-height: 1; }

/* ---------- logo slots ---------- */
.slots { margin-top: 40px; border: 1.5px solid var(--rule-strong); border-radius: 6px; background: var(--paper-raised); padding: 14px 16px 16px; display: grid; gap: 14px; }
.slots h2 { font-size: 19px; }
.ladder { display: flex; flex-wrap: wrap; gap: 18px 22px; align-items: flex-end; }
.slot { display: grid; justify-items: center; gap: 6px; text-align: center; }
.slot .box { display: grid; place-items: center; border: 1px dashed var(--rule-strong); padding: 6px; max-width: 100%; }
.tab-mock { display: inline-flex; align-items: center; gap: 6px; background: var(--panel); border-radius: 8px 8px 0 0; padding: 6px 12px; font-family: var(--sans); font-size: 12px; }
.slot-table { width: 100%; border-collapse: collapse; font-family: var(--sans); font-size: 12.5px; }
.slot-table th, .slot-table td { text-align: left; padding: 5px 10px 5px 0; border-bottom: 1px solid var(--rule); vertical-align: top; }
.slot-table th { font-weight: 600; color: var(--ink-muted); text-transform: uppercase; letter-spacing: .06em; font-size: 10.5px; }
.slot-table td.num { white-space: nowrap; }
.table-scroll { overflow-x: auto; }

/* ---------- floating bar ---------- */
.bar { position: fixed; z-index: 20; left: 50%; transform: translateX(-50%); bottom: calc(12px + env(safe-area-inset-bottom, 0px)); width: min(940px, calc(100% - 24px));
  background: var(--bar); color: var(--bar-fg); border-radius: 12px; padding: 10px 12px; display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center;
  font-family: var(--sans); font-size: 12px; box-shadow: 0 8px 24px rgba(0,0,0,.25); }
.bar fieldset { border: 0; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
.bar legend { float: left; margin-right: 6px; opacity: .7; text-transform: uppercase; letter-spacing: .08em; font-size: 10px; }
.bar label { cursor: pointer; }
.bar input { position: absolute; opacity: 0; pointer-events: none; }
.bar label span { display: inline-block; padding: 3px 8px; border-radius: 6px; border: 1px solid color-mix(in srgb, var(--bar-fg) 30%, transparent); }
.bar input:checked + span { background: var(--bar-fg); color: var(--bar); }
.bar input:focus-visible + span { outline: 2px solid var(--note); outline-offset: 1px; }
@media (max-width: 560px) { .bar { font-size: 11px; gap: 6px 10px; } }
</style>

<div id="app"></div>

<form class="bar" id="bar" aria-label="Prototype controls" onsubmit="return false">
  <fieldset><legend>Alert</legend>
    <label><input type="radio" name="al" id="al-none" value="none"><span>None</span></label>
    <label><input type="radio" name="al" id="al-mem" value="mem"><span>Not saving</span></label>
    <label><input type="radio" name="al" id="al-old" value="old"><span>Updated elsewhere</span></label>
    <label><input type="radio" name="al" id="al-fail" value="fail"><span>Save failed</span></label>
    <label><input type="radio" name="al" id="al-info" value="info"><span>Information</span></label>
    <label><input type="radio" name="al" id="al-all" value="all" checked><span>All at once</span></label>
  </fieldset>
  <fieldset><legend>Tabs</legend>
    <label><input type="radio" name="tc" id="tc-multi" value="multi" checked><span>A color per page</span></label>
    <label><input type="radio" name="tc" id="tc-one" value="one"><span>All yellow</span></label>
  </fieldset>
  <fieldset><legend>Shape</legend>
    <label><input type="radio" name="ts" id="ts-flag" value="flag" checked><span>Flag</span></label>
    <label><input type="radio" name="ts" id="ts-arrow" value="arrow"><span>Arrow</span></label>
  </fieldset>
  <fieldset><legend>Theme</legend>
    <label><input type="radio" name="th" id="th-sys" value="system" checked><span>System</span></label>
    <label><input type="radio" name="th" id="th-l" value="light"><span>Light</span></label>
    <label><input type="radio" name="th" id="th-d" value="dark"><span>Dark</span></label>
  </fieldset>
</form>

<script>
const S = { al: "all", tc: "multi", ts: "flag" };
/* Ethan's 16 x 16 potion (assets/pixil-frame-0.png), scaled by whole powers of two only. */
const POTION = "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABAAAAAQCAYAAAAf8/9hAAABdElEQVQ4T5WRP0sDMRiHf0nvrC2IFbr5DRy03RUqFr+Eo4KLk0oXBSs6OjjU0VE/gotWKeoktEjBwU+hRa9Xe0nkzZmQa61/nuGS901+T3J3DP9AKaVOVxawdn7HTM9OfoPCNJKAMJI/CczJq2e3unYlQwJzkktxfxEbz5GeD0oSAgoXDkq2NjAZbxuUEFZAYTpJZjgeK3XMHZXjPlNgHwqIAC5VQsIIN0y09m70WDiJBZZAQoWxhPaYLPsuXDxe0iOh/PiS4i2E52XQ2rq0YcIK7MmHJUByWoBKM/i5MfRFBPHShTeeHS0gVD4Vd53rZqcn0Om8or3ZwEx1Hk/VuxECD1C5FBgYfROgpzCZn0IQBnhYv9CbfxTE101DCKEXpJIQQR/tSkPXs7VleEGEZuU6KaCHKxE8Ave4XpTdPto79yjUyuAh0Ny+SoQJWxhJL3xHKuvrV9FwDk/5aO7Wh8JEouF+UBf3vw8y1CSJLb4YFaa1T3XZ1j50CdQPAAAAEGRlQkc4NjY1MDE3NDgxNzY2QjYxySIyZAAAAABJRU5ErkJggg==";
const potion = (px) => `<img class="potion" src="${POTION}" width="${px}" height="${px}" alt="">`;

const mark = `<a class="mark" href="#top" aria-label="Alchemy 5e, characters">${potion(32)}<span class="word">Alchemy<small>5E</small></span></a>`;
const navLinks = `<a href="#top" aria-current="page">Characters</a><a href="#top">Import</a><a href="#top">My Content</a><a href="#top">Preferences</a>`;

const ALERTS = {
  mem: { c: "", k: "Act", msg: `<b>This browser is not letting Alchemy 5e save.</b> Your characters are kept only until you close this tab.`, act: "Export them now" },
  old: { c: "", k: "Act", msg: `<b>Alchemy 5e was updated in another tab.</b> Reload to keep saving.`, act: "Reload this page" },
  fail: { c: "red", k: "Failed", msg: `<b>Saving to this browser failed.</b> Recent changes may not be kept.`, act: "Try again" },
  info: { c: "blue", k: "Info", msg: `Imported 2 packs: 340 items, 3 characters.`, act: "See the import log", x: true },
};
function note(key) {
  const a = ALERTS[key];
  return `<div class="note ${a.c}" role="${a.c === "blue" ? "status" : "alert"}"><span class="k">${a.k}</span><span class="msg">${a.msg} <button type="button" class="act">${a.act}</button></span>${a.x ? `<button type="button" class="x" aria-label="Dismiss">×</button>` : ""}</div>`;
}
function alerts() {
  /* "Not saving" and "Updated elsewhere" never show together in the app (AppShell.tsx), so "All" shows one yellow. */
  const keys = S.al === "all" ? ["fail", "old", "info"] : S.al === "none" ? [] : [S.al];
  return keys.map(note).join("");
}

const CHARS = [
  ["Brannoc Ashvale", "Hill Dwarf · Cleric (Life)", 7],
  ["Ysolde Marrow", "Tiefling · Warlock (Hexblade)", 5],
  ["Pip Tallowmere", "Lightfoot Halfling · Rogue (Thief) / Fighter", 9],
  ["Sister Okonma", "Human · Paladin (Devotion)", 12],
];

function slots() {
  const ladder = [16, 32, 64, 128, 256];
  return `<section class="slots" aria-labelledby="slots-h">
  <h2 id="slots-h">Logo slots</h2>
  <p class="muted" style="font-size:14.5px;max-width:65ch">Ethan's potion is drawn once at 16 &times; 16. Every other size is that art scaled by a whole power of two with nearest-neighbor scaling, so each pixel stays square and sharp.</p>
  <div class="ladder">
    <div class="slot"><span class="tab-mock">${potion(16)} Alchemy 5e</span><span class="lbl">Tab, 16 (1&times;)</span></div>
    ${ladder.slice(1).map((s) => `<div class="slot"><span class="box">${potion(s)}</span><span class="lbl">${s} (${s / 16}&times;)</span></div>`).join("")}
  </div>
  <div class="table-scroll"><table class="slot-table">
    <thead><tr><th>Slot</th><th>Size</th><th>Scale</th><th>File</th></tr></thead>
    <tbody>
      <tr><td>Browser tab favicon</td><td class="num">16, 32</td><td class="num">1&times;, 2&times;</td><td>PNG at both sizes (the 32 serves high-density screens)</td></tr>
      <tr><td>Header mark (shell C rail)</td><td class="num">32</td><td class="num">2&times;</td><td>Inline SVG or PNG with <code>image-rendering: pixelated</code></td></tr>
      <tr><td>Landing page</td><td class="num">128 or 256</td><td class="num">8&times;, 16&times;</td><td>PNG; ORC-150 picks which</td></tr>
      <tr><td>Home screen and install icon</td><td class="num">256, 512</td><td class="num">16&times;, 32&times;</td><td>PNG in the web manifest; iPhone gets the 256 and shrinks it to its 180 itself</td></tr>
    </tbody></table></div>
</section>`;
}

function render() {
  document.getElementById("app").innerHTML = `<div class="grid" id="top">
  <aside class="rail">${mark}<nav class="nav ${S.tc} ${S.ts}" aria-label="Main">${navLinks}</nav></aside>
  <main class="main"><div class="inner">
    <p class="proto"><b>Shell C, round 3.</b> The nav is page-marker tabs stuck to the margin rule; the current page sticks out furthest. Alerts are flat sticky notes the width of the page: yellow when you need to act, red when something failed, blue for information. The potion is Ethan's art at 2&times; (32 px).</p>
    <div class="alerts">${alerts()}</div>
    <div class="page">
      <div class="page-top"><h1>Characters</h1><button type="button" class="btn">New character</button></div>
      <ul class="list">${CHARS.map(([n, w, l]) => `<li><span class="name">${n}</span><span class="who">${w}</span><span class="lv"><b class="num">${l}</b><span class="lbl">Level</span></span></li>`).join("")}</ul>
      <p class="muted" style="font-size:13px;margin-top:8px">Example characters.</p>
      ${slots()}
    </div>
  </div></main></div>`;
  document.querySelectorAll(".note .x").forEach((b) => b.addEventListener("click", () => b.closest(".note").remove()));
}
document.getElementById("bar").addEventListener("change", (e) => {
  const t = e.target;
  if (t.name === "th") { if (t.value === "system") document.documentElement.removeAttribute("data-theme"); else document.documentElement.setAttribute("data-theme", t.value); return; }
  S[t.name] = t.value; render();
});
render();
</script>
