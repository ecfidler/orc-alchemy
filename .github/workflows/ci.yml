name: CI

on:
    push:
    pull_request:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read

jobs:
    ci:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
              with:
                  persist-credentials: false

            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version-file: package.json

            - run: bun install --frozen-lockfile
