# The checks of each pull request (ORC-358).
#
# - A pull request that changes only docs/, .claude/ or Markdown files runs
#   only the static job. The scope job decides that.
# - A push to main starts no run: the pull request ran on the same tree.
#   One full run on main each night is the safety net.
#
# Three jobs run at the same time, so a run takes as long as its longest job:
# - static: the docs check, lint, the typechecks and the small test suites.
# - unit: the unit tests of the app, in shards.
# - e2e: the Playwright tests of the app, in shards.
#
# To change the number of shards, change the matrix and the total in the
# --shard argument of the same job.

name: CI

on:
    # Each pull request, not only those into main: a stack of pull requests
    # merges in one operation, so each one must be checked (ORC-359).
    pull_request:
    schedule:
        # Each night at 09:17 UTC, on main.
        - cron: "17 9 * * *"
    workflow_dispatch:

# A new push to a pull request cancels the run of the push before.
concurrency:
    group: ci-${{ github.event.pull_request.number || github.sha }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    scope:
        runs-on: ubuntu-latest
        timeout-minutes: 5
        permissions:
            pull-requests: read
        outputs:
            code: ${{ steps.files.outputs.code }}
        steps:
            - id: files
              env:
                  GH_TOKEN: ${{ github.token }}
                  PR: ${{ github.event.pull_request.number }}
              run: |
                  # A run that is not for a pull request is a full run.
                  if [ -z "$PR" ]; then
                    echo "code=true" >> "$GITHUB_OUTPUT"
                    exit 0
                  fi
                  files=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --paginate --jq '.[].filename')
                  if echo "$files" | grep -qvE '^(docs/|\.claude/)|\.md$'; then
                    echo "code=true" >> "$GITHUB_OUTPUT"
                  else
                    echo "::notice::Only docs changed: the unit and e2e jobs do not run."
                    echo "code=false" >> "$GITHUB_OUTPUT"
                  fi

    static:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v7
              with:
                  persist-credentials: false

            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version-file: package.json

            - uses: actions/setup-node@v7
              with:
                  node-version: 24

            - run: bun install --frozen-lockfile

            - name: Docs bundle check
              run: bun run docs:check

            - name: Lint and format check
              run: bun run lint

            - name: Script tests
              run: bun run test:scripts

            - name: Typecheck
              working-directory: packages/app
              run: bun run typecheck

            - name: UI package typecheck
              working-directory: packages/ui
              run: bun run typecheck

            - name: UI package tests
              working-directory: packages/ui
              run: bun run test

            - name: Engine package typecheck
              working-directory: packages/engine
              run: bun run typecheck

            - name: Engine package tests
              working-directory: packages/engine
              run: bun run test

            - name: Bookmarklet typecheck
              working-directory: tools/exporter-bookmarklet
              run: bun run typecheck

            - name: Bookmarklet tests
              working-directory: tools/exporter-bookmarklet
              run: bun run test

    unit:
        needs: scope
        if: needs.scope.outputs.code == 'true'
        name: unit (${{ matrix.shard }}/3)
        runs-on: ubuntu-latest
        timeout-minutes: 15
        strategy:
            fail-fast: false
            matrix:
                shard: [1, 2, 3]
        steps:
            - uses: actions/checkout@v7
              with:
                  persist-credentials: false

            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version-file: package.json

            - uses: actions/setup-node@v7
              with:
                  node-version: 24

            - run: bun install --frozen-lockfile

            - name: Unit tests
              working-directory: packages/app
              run: bunx vitest run --shard=${{ matrix.shard }}/3

    e2e:
        needs: scope
        if: needs.scope.outputs.code == 'true'
        name: e2e (${{ matrix.shard }}/4)
        runs-on: ubuntu-latest
        timeout-minutes: 15
        strategy:
            fail-fast: false
            matrix:
                shard: [1, 2, 3, 4]
        steps:
            - uses: actions/checkout@v7
              with:
                  persist-credentials: false

            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version-file: package.json

            - uses: actions/setup-node@v7
              with:
                  node-version: 24

            - run: bun install --frozen-lockfile

            - name: Install Playwright Chromium
              working-directory: packages/app
              run: bunx playwright install --with-deps chromium

            - name: Playwright
              working-directory: packages/app
              run: bunx playwright test --shard=${{ matrix.shard }}/4
