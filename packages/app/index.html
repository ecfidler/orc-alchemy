<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Alchemy 5e</title>
    <link rel="icon" type="image/png" sizes="16x16" href="/potion-16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/potion-32.png" />
    <link rel="apple-touch-icon" href="/potion-256.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- From @orc-alchemy/ui themeHeadScript; index-html.test.ts checks the copy. -->
    <script>
      (function () {
        var root = document.documentElement;
        function apply(value) {
          if (value === "light" || value === "dark") root.dataset.theme = value;
          else delete root.dataset.theme;
        }
        try { apply(localStorage.getItem("theme")); } catch (e) {}
        addEventListener("storage", function (event) {
          if (event.key === "theme" || event.key === null) apply(event.newValue);
        });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
